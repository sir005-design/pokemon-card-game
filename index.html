<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Pro: Quiz Battle - Ultra Edition</title>
    <style>
        :root{--team1-color:#2a75bb;--team2-color:#e3350d;--color-fire:#ff9d55;--color-water:#5090d6;--color-grass:#63bc5a;--color-electric:#f4d23c;--color-normal:#a8a878;--color-any:#eeeeee}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans TC',Arial,sans-serif;user-select:none}
        body{background:#0a0a0c;color:#fff;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;transition:transform .1s}
        
        #fx-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:999}

        /* 大廳支援捲動 */
        #lobby{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;z-index:20;background:#0a0a0c;position:absolute;width:100%;height:100%;overflow-y:auto;}
        .config-box{position:relative; z-index:10; background:#111;padding:30px;border-radius:24px;border:2px solid #ffcb05;width:100%;max-width:850px;text-align:center;box-shadow:0 0 30px rgba(255,203,5,.2); margin: auto;}
        textarea{width:100%;height:90px;margin:10px 0;padding:12px;border-radius:12px;font-size:14px;background:#222;color:#fff;border:1px solid #444}
        
        .upload-section { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin: 10px 0; border: 2px dashed #666; text-align: left; }
        .cloud-input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #444; background: #000; color: #77cc55; font-size: 13px; outline:none; }
        .cloud-input:focus { border-color: #ffcb05; }

        .lobby-mascot { position: fixed; bottom: 5%; width: 160px; max-width: 15vw; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); animation: bounce 1.5s infinite alternate ease-in-out; pointer-events: none; z-index: 9999;}
        .mascot-left { left: 2%; }
        .mascot-right { right: 2%; animation-delay: 0.75s; }
        @keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-20px); } }
        
        .start-btn-content { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .pokeball-icon { width: 28px; height: 28px; }

        #battle-field{display:flex;height:100vh;flex-direction:column;overflow:hidden}
        .battle-main{flex:1;display:flex;justify-content:space-between;padding:5px 10px;gap:5px;min-height:0}
        
        .team-container{flex:1;display:flex;flex-direction:column;gap:5px;padding:15px;border-radius:25px;background:rgba(255,255,255,.03);border:3px solid transparent;transition:.3s;min-height:0; max-width:420px;}
        .team-container.active-team{border-color:#00f2ff;background:linear-gradient(180deg,rgba(0,242,255,.05) 0,rgba(0,100,255,.15) 100%);box-shadow:0 0 30px rgba(0,242,255,.6),inset 0 0 20px rgba(0,150,255,.4);animation:neonPulse 2s infinite alternate}
        @keyframes neonPulse{0%{box-shadow:0 0 15px rgba(0,242,255,.4),inset 0 0 10px rgba(0,150,255,.3);border-color:#00c3ff}100%{box-shadow:0 0 35px rgba(0,242,255,.8),inset 0 0 25px rgba(0,150,255,.6);border-color:#00f2ff}}
        
        .field-area{display:flex;flex:1;gap:15px;align-items:center;justify-content:center;min-height:0;flex-direction:row}
        .bench-grid{display:grid;grid-template-columns:repeat(2,110px);grid-template-rows:repeat(2,auto);gap:6px;justify-content:center}
        .active-zone{flex:0 0 auto;display:flex;justify-content:center;align-items:center;padding:5px;border:2px dashed #333;border-radius:12px}
        
        .hand-wrapper { position: relative; width: 100%; margin-top: auto; }
        .hand-tooltip { position: absolute; bottom: 100%; margin-bottom: 5px; left: 50%; transform: translateX(-50%); width: 95%; background: rgba(20, 20, 20, 0.9); color: #ffcb05; padding: 8px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; text-align: center; border: 2px solid #ffcb05; z-index: 100; pointer-events: none; opacity: 0; transition: opacity 0.2s ease-in-out; box-shadow: 0 5px 15px rgba(0,0,0,0.7); line-height: 1.4; }
        .hand-tooltip.show { opacity: 1; }
        
        .hand-area{height:95px;flex-shrink:0;background:rgba(0,0,0,.6);border-radius:12px;padding:5px;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;justify-content:flex-start; overflow-x:auto;}
        .hand-card{position:relative; width:58px;height:82px;flex-shrink:0;border-radius:8px;padding:4px;cursor:pointer;text-align:center;font-size:10px;font-weight:700;border:2px solid #fff;transition:.2s;box-shadow:0 4px 8px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
        .hand-card:hover{transform:translateY(-5px);filter:brightness(1.2);z-index:50;}
        .hand-card.selected{border-color:#0f0;transform:translateY(-8px);box-shadow:0 0 15px rgba(0,255,0,.5)}
        .hand-energy{background:#333}
        .hand-trainer{background:linear-gradient(135deg,#eee,#aaa);color:#222}

        .card{background:#fff;border-radius:8px;color:#222;padding:6px;font-size:11px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;border:3px solid transparent;box-shadow:0 6px 12px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
        .card-active{width:160px; transform: scale(1.05);}
        .card-active .card-img{height:80px}
        .card-bench{width:110px}
        .card-bench .card-img{height:60px}
        .card-bench .attack-row{padding:2px;font-size:9px;margin-top:2px}
        
        .card.type-fire{background:var(--color-fire)}
        .card.type-water{background:var(--color-water)}
        .card.type-grass{background:var(--color-grass)}
        .card.type-electric{background:var(--color-electric)}
        .card.type-normal{background:var(--color-normal)}

        .card:hover{transform:translateY(-3px) scale(1.03);z-index:5}
        .card.is-active-fighter{border-color:gold;box-shadow:0 0 20px rgba(255,215,0,.6); z-index:10;}
        .card.dead{filter:grayscale(100%);opacity:.5;pointer-events:none;}
        .card.dead.revivable{pointer-events:auto;animation:pulse 1.5s infinite;border-color:#0f0;opacity:.8;filter:grayscale(30%)}
        .card.valid-target{border-color:#0f0;box-shadow:0 0 15px #0f0;animation:pulse 1.5s infinite}
        @keyframes pulse{0%,100%{box-shadow:0 0 5px #0f0}50%{box-shadow:0 0 20px #0f0}100%{box-shadow:0 0 5px #0f0}}

        .card-header{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:4px}
        .active-header { display:flex; flex-direction:row; justify-content:space-between; align-items:center; margin-left:20px; font-weight:900; margin-bottom:4px; }
        .bench-header { display:flex; flex-direction:column; align-items:flex-start; margin-left:18px; font-weight:900; margin-bottom:4px; line-height:1.2; }
        .bench-header .name-text { font-size:11px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
        .bench-header .hp-text { font-size:10px; font-weight:900; }
        
        .card-img{width:100%;background:white;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #333;position:relative}
        .card-img img{width:85%;height:85%;object-fit:contain}
        .inspect-btn{position:absolute;top:-5px;left:-5px;background:rgba(0,0,0,.8);color:white;border-radius:50%;width:22px;height:22px;display:flex;justify-content:center;align-items:center;z-index:10;transition:transform .2s;border:1px solid #fff}
        .inspect-btn:hover{transform:scale(1.2);background:#ffcb05;color:black}
        
        .buff-container{position:absolute;top:-5px;right:-5px;display:flex;gap:2px;flex-direction:column;align-items:flex-end;z-index:5}
        .buff-tag{background:#e3350d;color:white;padding:2px 4px;border-radius:6px;font-size:8px;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.5)}
        .item-tag{background:#ffcb05;color:black;padding:2px 4px;border-radius:6px;font-size:8px;font-weight:bold;box-shadow:0 2px 4px rgba(0,0,0,.5);border:1px solid #000}
        .status-container{position:absolute;bottom:3px;left:3px;display:flex;gap:2px;flex-wrap:wrap;z-index:5}
        .status-tag{padding:2px 4px;border-radius:3px;font-size:8px;font-weight:bold;color:white;border:1px solid rgba(255,255,255,.5)}
        .status-poison{background-color:#904090}
        .status-paralyze{background-color:#f4d23c;color:#000}
        .status-burn{background-color:#f40}
        .status-asleep{background-color:#555}
        .status-confused{background-color:#f90}
        
        .energy-container{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;min-height:14px;background:rgba(255,255,255,.3);border-radius:4px;padding:2px}
        .energy-icon{width:12px;height:12px;border-radius:50%;border:1px solid #000;display:inline-block}
        .energy-fire{background:var(--color-fire)}
        .energy-water{background:var(--color-water)}
        .energy-grass{background:var(--color-grass)}
        .energy-electric{background:var(--color-electric)}
        .energy-normal{background:var(--color-normal)}
        .energy-any{background:var(--color-any)}
        .energy-rainbow{background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red)}
        
        .attack-row { margin-top: 4px; padding: 4px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; border: 1px solid rgba(0,0,0,0.1); }
        .attack-ready { background: rgba(255,255,255,0.95); opacity: 1; box-shadow: 0 0 5px rgba(255,255,255,0.6); }
        .attack-ready:hover { transform: scale(1.02); background: #fff; }
        .attack-disabled { background: rgba(255,255,255,0.3); opacity: 1; cursor: not-allowed; }
        .attack-disabled span { color: #333; } 
        .attack-special-icon { font-size: 9px; margin-left: 2px; color: #555; }
        
        .bench-attack-preview { margin-top:4px; display:flex; flex-direction:column; gap:3px; align-items:flex-start; background:rgba(255,255,255,0.1); border-radius:4px; padding:4px; }
        .bench-attack-preview > div { display:flex; gap:2px; justify-content:flex-start; }

        .hp-bar{height:6px;background:#333;border-radius:3px;margin:3px 0;overflow:hidden;border:1px solid #000}
        .hp-fill{height:100%;background:#4caf50;transition:width .3s}

        .center-panel{width:220px;display:flex;flex-direction:column;align-items:center;padding:5px; gap:8px;}
        #log{flex:1;width:100%;background:rgba(0,0,0,.7);border:1px solid #333;border-radius:8px;padding:8px;font-size:13px;color:#eee;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
        .log-entry{border-bottom:1px solid #222;padding-bottom:4px;animation:slideIn .3s ease-out; opacity: 1 !important; line-height: 1.4;}
        @keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
        
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1000}
        .modal-box{background:#1a1a1a;padding:30px;border-radius:20px;max-width:850px;width:90%;text-align:center;border:2px solid #ffcb05;position:relative}
        .btn{padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;border:none;font-size:14px;transition:.3s;width:100%;display:block;margin-bottom:8px;}
        .btn:disabled{opacity:0.4;cursor:not-allowed;}
        .btn:not(:disabled):hover{filter:brightness(1.3);transform:translateY(-2px)}
        .btn-blue{background:var(--team1-color);color:white}
        .btn-red{background:var(--team2-color);color:white}
        .btn-gold{background:#ffcb05;color:black;}
        .btn-dark{background:#333;color:white;}

        #setup-ui { display: flex; flex-direction: column; width: 100%; gap: 5px; margin-bottom: 10px; }

        .kahoot-btn { font-size: 22px; padding: 15px 25px; border-radius: 8px; border: none; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 0 rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: flex-start; min-height: 80px; flex: 1 1 calc(50% - 20px); }
        .kahoot-btn:hover { filter: brightness(1.15); transform: translateY(-2px); box-shadow: 0 7px 0 rgba(0,0,0,0.3); }
        .kahoot-btn:active { transform: translateY(5px); box-shadow: 0 0 0 rgba(0,0,0,0.3); }
        .kb-red { background-color: #e21b3c; }
        .kb-blue { background-color: #1368ce; }
        .kb-yellow { background-color: #d89e00; }
        .kb-green { background-color: #26890c; }

        .question-formatted{text-align:left;display:inline-block;max-width:100%;font-size:24px;line-height:1.6;font-family:Arial,sans-serif}
        .question-body{text-align:left;margin-bottom:15px; font-weight:bold; color:#ffcb05;}
        .question-q{color:white}
        .question-a{margin-top:10px;color:#ffcb05;font-weight:bold}
        .question-option{padding-left:2em;text-indent:-2em;margin-bottom:6px;text-align:left}
        
        #inspect-content .card{width:280px;font-size:14px;padding:12px;cursor:default;box-shadow:0 0 30px rgba(255,255,255,.5)}
        #inspect-content .card-img{height:140px}
        #inspect-content .energy-icon{width:16px;height:16px}
        #inspect-content .attack-row{font-size:14px;padding:8px;margin-top:8px}
        
        .hidden{display:none!important}
        .damage-pop{position:fixed;color:#f00;font-size:50px;font-weight:900;text-shadow:0 0 10px #fff;pointer-events:none;z-index:1000;animation:popUp 1s forwards}
        @keyframes popUp{0%{transform:scale(.5);opacity:1}100%{transform:translateY(-80px) scale(1.5);opacity:0}}
        
        #victory-modal{background:rgba(0,0,0,.7);justify-content:flex-end;padding-bottom:5vh}
        #victory-modal .modal-box{border-width:4px;box-shadow:0 10px 40px rgba(0,0,0,.8);margin-bottom:20px;background:linear-gradient(45deg,#ffd700,#ff8c00);color:#000;border-color:#fff}
        .close-btn{position:absolute;top:10px;right:15px;font-size:24px;cursor:pointer;color:#000;font-weight:bold;transition:.2s}
        .close-btn:hover{transform:scale(1.2);color:#fff}
        
        .coin-container{perspective:1000px;margin:20px auto;width:100px;height:100px;cursor:pointer;transition:transform .2s}
        .coin-container:hover{transform:scale(1.1)}
        .coin-container.flipping{pointer-events:none}
        .coin{width:100%;height:100%;position:relative;transform-style:preserve-3d}
        .coin-face{position:absolute;width:100%;height:100%;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;box-shadow:0 0 15px rgba(0,0,0,.5)}
        .coin-heads{background:linear-gradient(to bottom,#f44336 50%,#fff 50%);border:4px solid #333}
        .coin-heads::after{content:'';position:absolute;width:100%;height:6px;background:#333;top:50%;transform:translateY(-50%)}
        .coin-heads::before{content:'';position:absolute;width:24px;height:24px;background:#fff;border:4px solid #333;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2}
        .coin-tails{background:#333;color:#fff;transform:rotateY(180deg);border:4px solid #888}
    </style>
</head>
<body>

<canvas id="fx-canvas"></canvas>

<div id="sys-alert" class="modal" style="z-index: 9999;">
    <div class="modal-box" style="border-color: #ff4444; padding: 40px; max-width: 500px;">
        <div id="sys-alert-msg" style="font-size: 24px; margin-bottom: 30px; line-height:1.5;"></div>
        <button class="btn btn-gold" style="font-size:18px; width:150px; margin:0 auto;" onclick="document.getElementById('sys-alert').style.display='none'">確定</button>
    </div>
</div>

<div id="sys-confirm" class="modal" style="z-index: 9999;">
    <div class="modal-box" style="border-color: #ffcb05; padding: 40px; max-width: 500px;">
        <div id="sys-confirm-msg" style="font-size: 24px; margin-bottom: 30px; line-height:1.5;"></div>
        <div style="display:flex; gap:20px; justify-content:center;">
            <button id="sys-confirm-yes" class="btn btn-blue" style="font-size:18px; width:120px; margin:0;">確定</button>
            <button class="btn btn-red" style="font-size:18px; width:120px; margin:0;" onclick="document.getElementById('sys-confirm').style.display='none'">取消</button>
        </div>
    </div>
</div>

<div id="lobby">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png" class="lobby-mascot mascot-left">
    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png" class="lobby-mascot mascot-right">
    
    <div class="config-box">
        <h1 style="color: #ffcb05; margin-bottom: 10px; font-size: 36px;">Pokémon TCG Pro</h1>
        <p style="margin-bottom: 20px; color: #aaa;">終極平衡版：三模題庫切換、Kahoot! 式答題系統！</p>
        
        <div style="display:flex; gap:20px; margin-top:10px;">
            <div class="upload-section" style="flex:1;">
                <h3 style="color: #77cc55; margin-bottom:8px;">🌐 模式 A：Google 試算表</h3>
                <p style="font-size:11px; color:#ccc; margin-bottom:10px;">請將試算表「共用」設為知道連結的人皆可檢視：</p>
                <input type="text" id="cloud-url" class="cloud-input" placeholder="貼上 Google 試算表分享網址" onchange="fetchCloudCSV()">
                <div id="cloud-status" style="color: #ffcb05; font-size: 13px; font-weight:bold; margin-top:8px;"></div>
            </div>
            
            <div class="upload-section" style="flex:1;">
                <h3 style="color: #3399ff; margin-bottom:8px;">📝 模式 B：手動輸入題庫</h3>
                <p style="font-size:11px; color:#ccc; margin-bottom:10px;">由老師判定答對或答錯。多題請用 / 分隔：</p>
                <textarea id="qInput" placeholder="題目1 / 題目2 / ..."></textarea>
            </div>
        </div>

        <div class="upload-section mode-c" style="text-align: center; border: 2px dashed #666; margin-top: 15px;">
            <h3 style="color: #ff9d55; margin-bottom:5px;">📁 模式 C：上傳本地 CSV 檔案</h3>
            <p style="font-size:11px; color:#ccc; margin-bottom:10px;">支援2~4個選項，最後一欄請填入解答數字(1, 2, 3...)</p>
            <input type="file" id="csv-file" accept=".csv" style="color:white; font-size:14px; margin: 0 auto; display: block;" onchange="loadLocalCSV(event)">
        </div>

        <button class="btn btn-gold" style="width:260px; margin:15px auto 0; padding:12px; font-size:24px; border-radius:30px; font-weight:900; letter-spacing:2px;" onclick="initGame()">
            <div class="start-btn-content">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" class="pokeball-icon">
                START
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" class="pokeball-icon">
            </div>
        </button>
    </div>
</div>

<div id="battle-field" class="hidden">
    <div class="battle-main">
        <div id="side-1" class="team-container">
            <div id="header-1" style="display:flex; justify-content:center; align-items:center; gap:10px;"></div>
            <div class="field-area" id="field-1"></div>
            
            <div class="hand-wrapper">
                <div id="hand-tooltip-1" class="hand-tooltip"></div>
                <div style="font-size: 11px; margin-bottom: 2px;">手牌區 (最多7張)：</div>
                <div class="hand-area" id="hand-1"></div>
            </div>
        </div>

        <div class="center-panel">
            <h2 id="turn-indicator" style="color: #ffcb05; margin-bottom: 8px; font-size: 16px; text-align: center;"></h2>
            <div id="action-hint" style="color: #888; font-size: 12px; text-align: center; margin-bottom: 8px; min-height: 35px;"></div>
            
            <div id="setup-ui">
                <button id="btn-redraw" class="btn btn-gold" onclick="redrawCards()">🔄 重抽卡牌 (2)</button>
                <button class="btn btn-blue" onclick="startGame(1)">▶ TEAM 1 先攻</button>
                <button class="btn btn-red" onclick="startGame(2)">▶ TEAM 2 先攻</button>
            </div>
            
            <button id="end-turn-btn" class="btn btn-dark" style="display: none;" onclick="endTurn()">結束回合</button>
            <div id="log"></div>
        </div>

        <div id="side-2" class="team-container">
            <div id="header-2" style="display:flex; justify-content:center; align-items:center; gap:10px;"></div>
            <div class="field-area" id="field-2"></div>
            
            <div class="hand-wrapper">
                <div id="hand-tooltip-2" class="hand-tooltip"></div>
                <div style="font-size: 11px; margin-bottom: 2px;">手牌區 (最多7張)：</div>
                <div class="hand-area" id="hand-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- 答題與判定視窗 -->
<div id="quiz-modal" class="modal">
    <div class="modal-box" style="max-width: 900px;">
        <h2 id="modal-team-name" style="margin-bottom: 20px; font-size:32px;"></h2>
        <div id="quiz-text" style="margin: 20px 0;"></div>
        <div id="quiz-options-container" style="display: flex; gap: 20px; justify-content: center; flex-wrap: wrap;"></div>
    </div>
</div>

<div id="coin-modal" class="modal">
    <div class="modal-box">
        <h2 style="color:#f4d23c;">🪙 判定中...</h2>
        <p id="coin-desc" style="font-size: 16px; margin: 10px 0; line-height: 1.5;"></p>
        
        <div id="digital-coin-area" style="margin: 20px 0; display: flex; flex-direction: column; align-items: center;">
            <div class="coin-container" id="auto-coin" onclick="autoFlipCoin()" title="點擊自動擲硬幣！">
                <div class="coin" id="coin-inner">
                    <div class="coin-face coin-heads"></div>
                    <div class="coin-face coin-tails">反</div>
                </div>

<script>
    function showAlert(msg) { document.getElementById('sys-alert-msg').innerText = msg; document.getElementById('sys-alert').style.display = 'flex'; }
    function showConfirm(msg, onYes) { document.getElementById('sys-confirm-msg').innerText = msg; document.getElementById('sys-confirm-yes').onclick = () => { document.getElementById('sys-confirm').style.display = 'none'; onYes(); }; document.getElementById('sys-confirm').style.display = 'flex'; }
    function showHandTooltip(team, text) { const el = document.getElementById('hand-tooltip-' + team); if (el && text) { el.innerText = text; el.classList.add('show'); } }
    function hideHandTooltip(team) { const el = document.getElementById('hand-tooltip-' + team); if (el) el.classList.remove('show'); }

    // --- ★ 視覺特效部分 ★ ---
    const fxCanvas = document.getElementById('fx-canvas'); const fxCtx = fxCanvas.getContext('2d');
    let fxParticles = [], fxSparks = [], fxProjectiles = [], fxSpecial = []; let screenShake = 0, hitStop = 0, fxFrame = 0;
    function resizeFxCanvas() { fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeFxCanvas); resizeFxCanvas();
    function getTypeColor(type) { const colors = { fire: '#FF4400', water: '#0088FF', grass: '#00FF44', electric: '#FFDD00', normal: '#FFFFFF', psychic: '#FF00FF', poison: '#A040A0', dragon: '#7038F8' }; return colors[type] || '#FFFFFF'; }
    
    function triggerModernHit(x, y, type, dmg) {
        const color = getTypeColor(type);
        fxSparks.push({ x, y, color, l: 1.0, scale: 0.1, maxScale: 0.5 + dmg/250 });
        for(let i=0; i<20; i++) fxParticles.push({ x, y, c: color, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, l: 1.0, d: 0.03, s: 4 + Math.random()*4 });
        screenShake = Math.min(25, 10 + dmg/10); hitStop = 6;
    }

    function triggerUltimateHit(tx, ty, type, dmg, sx, sy) {
        const color = getTypeColor(type);
        if (type === 'electric') {
            fxSpecial.push({ type: 'thunder', x: tx, y: ty, l: 1.0 });
            setTimeout(() => { triggerModernHit(tx, ty, type, dmg * 1.5); screenShake = 40; hitStop = 8; }, 150);
        } else {
            let count = 0;
            let burst = setInterval(() => {
                fxProjectiles.push({
                    x: sx + (Math.random()-0.5)*80, y: sy + (Math.random()-0.5)*80,
                    tx: tx + (Math.random()-0.5)*60, ty: ty + (Math.random()-0.5)*60,
                    c: color, type: type, speed: 0.15, progress: 0
                });
                count++;
                if (count >= 7) {
                    clearInterval(burst);
                    setTimeout(() => { triggerModernHit(tx, ty, type, dmg); screenShake = 35; hitStop = 8; }, 150);
                }
            }, 80);
        }
    }

    function animateFx() {
        fxFrame++; if(hitStop > 0) { hitStop--; requestAnimationFrame(animateFx); return; }
        if(screenShake > 0) { document.body.style.transform = `translate(${(Math.random()-0.5)*screenShake}px, ${(Math.random()-0.5)*screenShake}px)`; screenShake *= 0.85; if(screenShake < 0.5) { screenShake = 0; document.body.style.transform = ''; } } else { document.body.style.transform = ''; }
        fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height); fxCtx.globalCompositeOperation = 'lighter';
        fxSpecial = fxSpecial.filter(s => s.l > 0);
        fxSpecial.forEach(s => {
            if (s.type === 'thunder') {
                fxCtx.save(); fxCtx.strokeStyle = '#FFF'; fxCtx.shadowBlur = 40; fxCtx.shadowColor = '#FFDD00'; fxCtx.lineWidth = 20 * s.l;
                fxCtx.beginPath(); let x = s.x + (Math.random()-0.5)*150, y = 0; fxCtx.moveTo(x, y);
                while(y < s.y) { x += (Math.random()-0.5)*60; y += 40; fxCtx.lineTo(x, y); } fxCtx.stroke();
                fxCtx.strokeStyle = '#FFFFFF'; fxCtx.lineWidth = 8 * s.l; fxCtx.beginPath(); fxCtx.moveTo(s.x, 0); fxCtx.lineTo(s.x, s.y); fxCtx.stroke();
                fxCtx.restore(); s.l -= 0.15;
            }
        });
        fxProjectiles = fxProjectiles.filter(p => p.progress < 1);
        fxProjectiles.forEach(p => { p.progress += p.speed; if (p.progress > 1) p.progress = 1; const curX = p.x + (p.tx - p.x) * p.progress; const curY = p.y + (p.ty - p.y) * p.progress; fxCtx.save(); fxCtx.fillStyle = p.c; fxCtx.shadowBlur = 15; fxCtx.shadowColor = p.c; fxCtx.translate(curX, curY); if (p.type === 'grass') { fxCtx.rotate(p.progress * Math.PI * 4); fxCtx.beginPath(); fxCtx.ellipse(0, 0, 16, 6, 0, 0, Math.PI*2); fxCtx.fill(); } else if (p.type === 'water') { fxCtx.beginPath(); fxCtx.arc(0, 0, 12, 0, Math.PI*2); fxCtx.fill(); for(let i=0; i<2; i++) fxParticles.push({x:curX, y:curY, c:'#fff', vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3, s:3, d:0.1}); } else if (p.type === 'fire') { fxCtx.beginPath(); fxCtx.arc(0, 0, 14, 0, Math.PI*2); fxCtx.fill(); fxParticles.push({x:curX, y:curY, c:'#ff0', vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5, s:5, d:0.1}); } else { fxCtx.beginPath(); fxCtx.arc(0, 0, 12, 0, Math.PI*2); fxCtx.fill(); fxParticles.push({x:curX, y:curY, c:p.c, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, s:4, d:0.1}); } fxCtx.restore(); if (p.progress === 1) { fxSparks.push({ x: p.tx, y: p.ty, color: p.c, l: 1.0, scale: 0.08, maxScale: 0.25 }); screenShake = 15; } });
        fxSparks = fxSparks.filter(s => s.l > 0);
        fxSparks.forEach(s => { drawSparkV2(s); s.scale += (s.maxScale - s.scale) * 0.2; s.l -= 0.04; });
        fxParticles = fxParticles.filter(p => p.l > 0);
        fxParticles.forEach(p => { fxCtx.save(); fxCtx.globalAlpha = p.l; fxCtx.fillStyle = p.c; fxCtx.shadowBlur = 10; fxCtx.shadowColor = p.c; fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); fxCtx.fill(); fxCtx.restore(); p.x += p.vx; p.y += p.vy; p.l -= p.d; });
        requestAnimationFrame(animateFx);
    }
    animateFx();
    
    function drawSparkV2(s) {
        fxCtx.save(); fxCtx.translate(s.x, s.y); fxCtx.globalAlpha = s.l; fxCtx.globalCompositeOperation = 'lighter';
        const coreGrad = fxCtx.createRadialGradient(0, 0, 0, 0, 0, 50 * s.scale);
        coreGrad.addColorStop(0, '#fff'); coreGrad.addColorStop(0.4, s.color); coreGrad.addColorStop(1, 'transparent');
        fxCtx.fillStyle = coreGrad; fxCtx.beginPath(); fxCtx.arc(0, 0, 60 * s.scale, 0, Math.PI*2); fxCtx.fill();
        fxCtx.strokeStyle = s.color; fxCtx.lineWidth = 5 * s.l; fxCtx.beginPath(); fxCtx.arc(0, 0, 150 * s.scale, 0, Math.PI * 2); fxCtx.stroke();
        fxCtx.fillStyle = '#fff';
        for(let i=0; i<16; i++) {
            fxCtx.save(); fxCtx.rotate((i / 16) * Math.PI * 2 + fxFrame * 0.05);
            const len = (i % 2 === 0 ? 200 : 100) * s.scale; const w = 3 * s.scale;
            fxCtx.beginPath(); fxCtx.moveTo(0, -w); fxCtx.lineTo(len, 0); fxCtx.lineTo(0, w); fxCtx.fill();
            if(i % 4 === 0) { fxCtx.globalAlpha = s.l * 0.5; fxCtx.fillRect(0, -1, len * 1.5, 2); }
            fxCtx.restore();
        }
        fxCtx.restore();
    }

    // ★ 修正：還原完整的 showDamage 函數，確保特效觸發與座標計算正常運作 ★
    function showDamage(uid, dmg, type = 'normal', isUltimate = false, attackerUid = null) {
        const target = document.getElementById(uid);
        if(!target) return;
        const rect = target.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let sx = window.innerWidth / 2;
        let sy = window.innerHeight / 2;

        if (attackerUid) {
            const attackerEl = document.getElementById(attackerUid);
            if (attackerEl) {
                const aRect = attackerEl.getBoundingClientRect();
                sx = aRect.left + aRect.width / 2;
                sy = aRect.top + aRect.height / 2;
            }
        }
        
        const popDelay = isUltimate ? (type === 'electric' ? 200 : 700) : 0;
        
        if (dmg > 0) {
            if (isUltimate) triggerUltimateHit(cx, cy, type, dmg, sx, sy);
            else triggerModernHit(cx, cy, type, dmg);
        }
        
        setTimeout(() => {
            const pop = document.createElement('div');
            pop.className = 'damage-pop';
            pop.textContent = dmg > 0 ? `-${dmg}` : "MISS";
            pop.style.left = `${cx - 25}px`;
            pop.style.top = `${cy - 25}px`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 1000);
        }, popDelay);
    }

    function fetchCloudCSV() {
        let url = document.getElementById('cloud-url').value.trim();
        if(!url) return;
        document.getElementById('cloud-status').innerText = "⏳ 解析連結中...";
        
        const idMatch = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!idMatch || !idMatch[1]) { 
            document.getElementById('cloud-status').innerText = "❌ 無法解析網址，請確認包含 /d/ 試算表ID";
            return;
        }
        
        const sheetId = idMatch[1];
        const callbackName = 'gvizCallback_' + Date.now();
        
        // 使用 JSONP 完美繞過 file:// 的 CORS 限制
        window[callbackName] = function(data) {
            try {
                state.csvQuestions = [];
                let rows = data.table.rows;
                let startIdx = 0;
                if(rows.length > 0 && rows[0].c[0] && rows[0].c[0].v && typeof rows[0].c[0].v === 'string') {
                    const firstCell = rows[0].c[0].v.toLowerCase();
                    if(firstCell.includes('題') || firstCell.includes('question') || firstCell.includes('答')) {
                        startIdx = 1;
                    }
                }
                
                for(let i = startIdx; i < rows.length; i++) {
                    let row = rows[i];
                    if(!row.c || !row.c[0] || row.c[0].v === null || row.c[0].v === undefined) continue;
                    
                    let q = row.c[0].v.toString().trim();
                    let cols = row.c.map(cell => (cell && cell.v !== null && cell.v !== undefined) ? cell.v.toString().trim() : "");
                    
                    while(cols.length > 0 && cols[cols.length - 1] === "") { cols.pop(); }
                    
                    if(cols.length >= 3) {
                        let ans = parseInt(cols[cols.length - 1]);
                        let opts = cols.slice(1, cols.length - 1).filter(o => o !== "");
                        if(!isNaN(ans) && ans > 0 && ans <= opts.length) {
                            state.csvQuestions.push({ q: q, opts: opts, ans: ans });
                        }
                    }
                }
                
                if (state.csvQuestions.length > 0) {
                    state.quizMode = 'csv';
                    document.getElementById('cloud-status').innerText = `✅ 連線成功！讀取到 ${state.csvQuestions.length} 題。自動答題模式啟動。`;
                } else {
                    throw new Error("No valid data");
                }
            } catch (e) {
                document.getElementById('cloud-status').innerText = "❌ 解析失敗。請確認試算表格式（題目, 選項1, 選項2, ..., 解答數字）。";
            }
            delete window[callbackName];
            document.getElementById(callbackName).remove();
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=responseHandler:${callbackName}`;
        script.onerror = function() {
            document.getElementById('cloud-status').innerText = "❌ 連線失敗。請確認試算表「共用」已設為「知道連結的任何人皆可檢視」。";
            delete window[callbackName];
            script.remove();
        };
        document.body.appendChild(script);
    }

    function loadLocalCSV(e) {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => { 
            parseCSVData(evt.target.result); 
            if (state.csvQuestions.length > 0) {
                alert(`✅ 本地題庫載入成功！共讀取到 ${state.csvQuestions.length} 題。自動答題模式啟動。`); 
            } else {
                alert("❌ 無法解析題庫，請確認 CSV 檔案格式是否正確。"); 
            }
        };
        reader.readAsText(file);
    }

    function parseCSVData(text) {
        const lines = text.split(/\r\n|\n|\r/); 
        state.csvQuestions = [];
        let startIndex = 0;
        if (lines[0] && (lines[0].includes('題') || lines[0].includes('答') || lines[0].includes('選項') || lines[0].includes('Question') || lines[0].includes('question'))) {
            startIndex = 1;
        }
        for(let i = startIndex; i < lines.length; i++) {
            let line = lines[i].trim();
            if(!line) continue;
            let cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.trim().replace(/^"(.*)"$/, '$1'));
            while(cols.length > 0 && cols[cols.length - 1] === "") { cols.pop(); }
            if(cols.length >= 3) {
                let ans = parseInt(cols[cols.length - 1]); 
                let opts = cols.slice(1, cols.length - 1).filter(o => o !== ""); 
                if(!isNaN(ans) && ans >= 1 && ans <= opts.length) {
                    state.csvQuestions.push({ q: cols[0], opts: opts, ans: ans });
                } else if (!isNaN(ans) && ans > 0) {
                    state.csvQuestions.push({ q: cols[0], opts: opts, ans: ans });
                }
            }
        }
        if(state.csvQuestions.length > 0) state.quizMode = 'csv';
    }

    function formatQuestion(text) {
        if (!text) return "讀取題目時發生錯誤";
        text = text.replace(/[‘’]/g, "'").replace(/(\w)'\s+([a-zA-Z])/g, "$1'$2"); 
        let body = text; let options = [];
        if(text.includes('(1)') && text.includes('(2)')) {
            body = text.substring(0, text.indexOf('(1)')).trim();
            options.push(text.substring(text.indexOf('(1)'), text.indexOf('(2)')).trim());
            if(text.includes('(3)')) {
                options.push(text.substring(text.indexOf('(2)'), text.indexOf('(3)')).trim());
                if(text.includes('(4)')) {
                    options.push(text.substring(text.indexOf('(3)'), text.indexOf('(4)')).trim());
                    options.push(text.substring(text.indexOf('(4)')).trim());
                } else {
                    options.push(text.substring(text.indexOf('(3)')).trim());
                }
            } else {
                options.push(text.substring(text.indexOf('(2)')).trim());
            }
        }
        let qPart = body; let aPart = '';
        if (body.includes('Q:') && body.includes('A:')) {
            qPart = body.substring(0, body.indexOf('A:')).trim(); aPart = body.substring(body.indexOf('A:')).trim();
        }
        if (options.length > 0) {
            return `<div class="question-formatted"><div class="question-body"><div class="question-q">${qPart}</div>${aPart ? `<div class="question-a">${aPart}</div>` : ''}</div>${options.map(opt => `<div class="question-option">${opt}</div>`).join('')}</div>`;
        }
        if (aPart) return `<div class="question-formatted" style="text-align: center;"><div class="question-body"><div class="question-q">${qPart}</div><div class="question-a">${aPart}</div></div></div>`;
        return `<div style="text-align:center; font-size:28px; line-height:1.5;">${text}</div>`;
    }

    function startQuiz() {

            state.step = 'must_swap'; updateHint("⚠️ 戰鬥寶可夢已氣絕！請點擊後備區寶可夢上場。"); render(); return;
        }

        activeP.status.immune_next = false; activeP.status.reduce_dmg_20 = false; activeP.status.reduce_dmg_30 = false; activeP.status.reduce_dmg_50 = false;
        if(activeP.status.cant_attack > 0) { addLog(`🚫 ${activeP.name} 受招式副作用影響，本回合無法攻擊！(但可使用道具或撤退)`); }

        state.step = 'quiz'; state.selectedHandItem = null; state.isAttacking = false;
        
        const coinInner = document.getElementById('coin-inner');
        if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
        
        document.getElementById('modal-team-name').textContent = `TEAM ${state.currentTeam} 答題時間`;
        document.getElementById('modal-team-name').style.color = state.currentTeam === 1 ? 'var(--team1-color)' : 'var(--team2-color)';
        
        const qContainer = document.getElementById('quiz-options-container');
        qContainer.innerHTML = '';

        if (state.quizMode === 'csv' && state.csvQuestions.length > 0) {
            const q = state.csvQuestions[state.qIdx % state.csvQuestions.length];
            document.getElementById('quiz-text').innerHTML = `<div style="font-size:32px; font-weight:bold; color:#fff; text-shadow: 2px 2px 4px #000; margin-bottom:20px;">${q.q}</div>`;
            
            const styles = ['kb-red', 'kb-blue', 'kb-yellow', 'kb-green'];
            const icons = ['▲', '◆', '●', '■'];
            
            q.opts.forEach((opt, i) => {
                const isCorrect = (i + 1 === q.ans);
                qContainer.innerHTML += `
                    <button class="kahoot-btn ${styles[i % 4]}" onclick="checkAnswer(${isCorrect})">
                        <span style="margin-right:12px; font-size:24px;">${icons[i % 4]}</span>
                        <span style="flex:1; text-align:left;">${opt}</span>
                    </button>
                `;
            });
        } else {
            let qText = "載入題目發生錯誤";
            if (state.questions && state.questions.length > 0) { qText = state.questions[state.qIdx % state.questions.length]; }
            document.getElementById('quiz-text').innerHTML = formatQuestion(qText);
            
            qContainer.innerHTML = `
                <button class="btn" style="background: #4caf50; color: white; padding: 15px 40px; width:auto; font-size:24px; margin: 0 10px;" onclick="checkAnswer(true)">◯ 答對</button>
                <button class="btn" style="background: #f44336; color: white; padding: 15px 40px; width:auto; font-size:24px; margin: 0 10px;" onclick="checkAnswer(false)">✕ 答錯</button>
            `;
        }

        document.getElementById('quiz-modal').style.display = 'flex';
        updateHint("答對題目即可獲得資源並進行行動！"); render();
    }

    function getSmartEnergyType(team) {
        let pool = new Set();
        team.pokemon.filter(p => p.currHp > 0).forEach(p => { pool.add(p.type); p.attacks.forEach(atk => { atk.cost.forEach(c => { if (c !== 'any') pool.add(c); }); }); });
        let poolArr = Array.from(pool); if (poolArr.length === 0) poolArr = ['normal'];
        let chosen = poolArr[Math.floor(Math.random() * poolArr.length)];
        if (Math.random() < 0.15) chosen = 'rainbow'; return chosen;
    }

    function checkAnswer(correct) {
        const currentQIdx = state.qIdx;
        document.getElementById('quiz-modal').style.display = 'none'; state.qIdx++;

        if(correct) {
            state.step = 'action'; state.hasAttachedEnergyThisTurn = false; state.isAttacking = false;
            const myTeam = state.teams[state.currentTeam];
            const givenEnergy = getSmartEnergyType(myTeam);
            
            if (myTeam.hand.length < 7) { 
                myTeam.hand.push({ cardType: 'energy', type: givenEnergy }); addLog(`✅ 答對了！獲得 1 張 [${getTypeName(givenEnergy)}] 能量卡。`); 
            } else { addLog(`✅ 答對了！(手牌已滿7張無法獲得卡牌)`); }

            if(Math.random() < 0.4 && myTeam.hand.length < 7) {
                const trainer = TRAINERS_DB[Math.floor(Math.random() * TRAINERS_DB.length)];
                myTeam.hand.push({ cardType: 'trainer', ...trainer }); addLog(`🎁 額外獲得訓練家卡：「${trainer.name}」！`);
            }
            updateHint("請點擊手牌使用，或點擊招式攻擊 (攻擊後將自動結束回合)。\n🔍 點選左上角放大鏡可查看詳細狀態。");
        } else {
            // 紀錄錯題邏輯
            const myTeam = state.teams[state.currentTeam];
            let qText = "";
            if (state.quizMode === 'csv') {
                const qObj = state.csvQuestions[currentQIdx % state.csvQuestions.length];
                qText = `第${(currentQIdx % state.csvQuestions.length) + 1}題:${qObj.q}`;
            } else {
                const qStr = state.questions[currentQIdx % state.questions.length];
                qText = `第${(currentQIdx % state.questions.length) + 1}題:${qStr.length > 15 ? qStr.substring(0, 15) + '...' : qStr}`;
            }
            myTeam.wrongAnswers.push(qText);

            addLog(`❌ 答錯了，無法獲得資源，回合結束。`); setTimeout(processEndOfTurn, 1000);
        }
        render();
    }

    function selectHandCard(idx) {
        if(state.step !== 'action' || state.isAttacking) return;
        const myTeam = state.teams[state.currentTeam]; const card = myTeam.hand[idx];

        if(state.selectedHandItem && state.selectedHandItem.index === idx) {
            state.selectedHandItem = null; updateHint("已取消選取。");
        } else {
            state.selectedHandItem = { index: idx, data: card };
            if(card.cardType === 'energy') {
                if(state.hasAttachedEnergyThisTurn) { return showAlert("每回合只能附著 1 張能量卡！"); }
                updateHint("請點擊場上任一隻寶可夢來附著能量。");
            } else if (card.cardType === 'trainer') {
                if(card.target === 'none') useTrainerCard(null, null);
                else if(card.target === 'ally') updateHint(`請點擊我方一隻寶可夢使用「${card.name}」。`);
                else if(card.target === 'active_ally') updateHint(`請點擊我方戰鬥寶可夢使用「${card.name}」。`);
                else if(card.target === 'bench') updateHint(`請點擊我方後備區寶可夢與前台交換。`);
                else if(card.target === 'dead_ally') updateHint(`請點擊我方陣亡(半透明)的寶可夢將其復活至後備區。`);
                else if(card.target === 'enemy_bench') updateHint(`請點擊對手後備區的寶可夢。`);
            }
        }
        render();
    }

    function retreatToBench(team, newIdx) {
        const oldActive = team.pokemon[team.activeIdx];
        if(oldActive.currHp > 0) {
            oldActive.status = { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0 };
            if (oldActive.originalForm) {
                oldActive.name = oldActive.originalForm.name; oldActive.hp = oldActive.originalForm.hp;
                oldActive.currHp = Math.min(oldActive.originalForm.hp, oldActive.currHp + 60); 
                oldActive.type = oldActive.originalForm.type;
                oldActive.attacks = oldActive.originalForm.attacks; oldActive.weakness = oldActive.originalForm.weakness;
                oldActive.resistance = oldActive.originalForm.resistance; oldActive.id = oldActive.originalForm.id;
                delete oldActive.originalForm; addLog(`✨ 夢幻回到後備區，解除變身並恢復 60 HP！`);
            }
        } else {
             if (oldActive.originalForm) { Object.assign(oldActive, oldActive.originalForm); delete oldActive.originalForm; }
        }
        team.activeIdx = newIdx;
    }

    function clickPokemon(teamNum, pIdx) {
        if(state.isAttacking) return;
        const team = state.teams[teamNum]; const p = team.pokemon[pIdx];

        if (p.currHp <= 0) {
            let isReviving = state.selectedHandItem && state.selectedHandItem.data.target === 'dead_ally' && teamNum === state.currentTeam;
            if (!isReviving) return;
        }

        if(state.step === 'must_swap' && teamNum === state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) {
            team.pokemon[team.activeIdx].status = { poison: false, paralyze: false, burn: false, asleep: false, confused: false, immune_next: false, reduce_dmg_20: false, reduce_dmg_30: false, reduce_dmg_50: false, cant_attack: 0, enemy_dmg_minus_30: 0 };
            if(team.pokemon[team.activeIdx].originalForm) {
                 Object.assign(team.pokemon[team.activeIdx], team.pokemon[team.activeIdx].originalForm);
                 team.pokemon[team.activeIdx].currHp = 0; delete team.pokemon[team.activeIdx].originalForm;
            }
            team.activeIdx = pIdx; addLog(`🔄 ${p.name} 上場接替戰鬥！`);
            
            if (state.nextTurnTeam) { checkEotSwaps(); } else { state.step = 'quiz'; startQuiz(); }
            return;
        }

        if (state.step === 'select_enemy_bench') {
            if (teamNum !== state.currentTeam && pIdx !== state.teams[teamNum].activeIdx && p.currHp > 0) {
                retreatToBench(state.teams[teamNum], pIdx);
                addLog(`💨 誘導香氣生效，強制將 ${p.name} 拖入戰鬥區！`);
                state.step = 'finished'; render(); setTimeout(processEndOfTurn, 1500);
            } else { showAlert("請選擇對手後備區存活的寶可夢！"); }
            return;
        }

        if (state.step === 'select_transform_target') {
            if (teamNum !== state.currentTeam && p.currHp > 0) {
                const attacker = state.transformingPokemon;
                attacker.originalForm = {
                    name: attacker.name, hp: attacker.hp, type: attacker.type, attacks: JSON.parse(JSON.stringify(attacker.attacks)),
                    weakness: attacker.weakness, resistance: attacker.resistance, id: attacker.id
                };
                attacker.name = p.name; attacker.hp = p.hp; attacker.type = p.type; attacker.attacks = p.attacks;
                attacker.weakness = p.weakness; attacker.resistance = p.resistance; attacker.id = p.id;
                attacker.attachedEnergy = [...p.attachedEnergy];
                addLog(`✨ 夢幻變身成了對手的 ${p.name}，並複製了其附著能量！(撤退時將恢復60HP並解除變身)`);
                state.transformingPokemon = null; state.step = 'finished'; render(); setTimeout(processEndOfTurn, 1500);
            } else { showAlert("請選擇對手場上的寶可夢！"); }
            return;
        }

        if(state.step !== 'action') return;

        if(state.selectedHandItem) {
            const card = state.selectedHandItem.data; let valid = false;
            
            if(card.cardType === 'energy' && teamNum === state.currentTeam && p.currHp > 0) valid = true;
            if(card.target === 'ally' && teamNum === state.currentTeam && p.currHp > 0) valid = true;
            if(card.target === 'active_ally' && teamNum === state.currentTeam && pIdx === team.activeIdx && p.currHp > 0) valid = true;
            if(card.target === 'bench' && teamNum === state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) valid = true;
            if(card.target === 'dead_ally' && teamNum === state.currentTeam && p.currHp <= 0) valid = true;
            if(card.target === 'enemy_bench' && teamNum !== state.currentTeam && pIdx !== state.teams[teamNum].activeIdx && p.currHp > 0) valid = true;

            if(!valid) return;

            if(card.cardType === 'energy') {
                p.attachedEnergy.push(card.type);
                state.teams[state.currentTeam].hand.splice(state.selectedHandItem.index, 1);
                state.hasAttachedEnergyThisTurn = true;
                addLog(`⚡ 為 ${p.name} 附著了 [${getTypeName(card.type)}] 能量。`);
                state.selectedHandItem = null; updateHint("能量附著完畢，請選擇攻擊或結束回合。"); render();
            } else if(card.cardType === 'trainer') { useTrainerCard(teamNum, pIdx); }
            return;
        }

        if(!state.selectedHandItem && teamNum === state.currentTeam && pIdx !== team.activeIdx && p.currHp > 0) {
            const activeP = team.pokemon[team.activeIdx];
            if(activeP.attachedEnergy.length < 1) { return showAlert(`撤退失敗：需要消耗 1 個能量才能撤退！`); }
            
            showConfirm(`要消耗 1 個能量將 ${activeP.name} 撤退，換 ${p.name} 上場嗎？`, () => {
                activeP.attachedEnergy.pop(); retreatToBench(team, pIdx);
                addLog(`🏃 ${activeP.name} 消耗能量撤退，由 ${p.name} 上場！`); render();
            });
            return;
        }
    }

    function useTrainerCard(teamNum, targetIdx) {
        const myTeam = state.teams[state.currentTeam]; const card = state.selectedHandItem.data; let consumed = true;
        
        if(card.id === 'pokemon_catcher') {
            state.pendingCatcherTarget = targetIdx; state.coinFlipReason = 'catcher';
            document.getElementById('coin-desc').innerHTML = `請為 <b>寶可夢捕捉器</b> 擲硬幣：<br>正面則強制對手替換，反面則失敗。`;
            const coinInner = document.getElementById('coin-inner');
            if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
            document.getElementById('coin-modal').style.display = 'flex'; 
            return; 
        }
        
        if(card.id === 'potion' || card.id === 'super_potion') {
            const p = myTeam.pokemon[targetIdx];
            if(p.currHp === p.hp) return showAlert("HP 已經是滿的！");
            const heal = card.id === 'potion' ? 30 : 50;
            p.currHp = Math.min(p.hp, p.currHp + heal);
            addLog(`💊 使用 ${card.name}！${p.name} 回復了 ${heal} HP。`);
        } 
        else if(card.id === 'full_heal') {
            const p = myTeam.pokemon[targetIdx];
            p.status.poison = false; p.status.paralyze = false; p.status.burn = false; p.status.asleep = false; p.status.confused = false;
            addLog(`🌿 使用萬能藥！${p.name} 解除了所有異常狀態。`);
        }
        else if(card.id === 'switch') { retreatToBench(myTeam, targetIdx); addLog(`🔄 使用交替卡！無消耗將 ${myTeam.pokemon[targetIdx].name} 換上場，並解除所有異常狀態。`); }
        else if(card.id === 'rescue_stretcher') {
            const p = myTeam.pokemon[targetIdx];
            p.currHp = Math.ceil(p.hp / 2); p.isDead = false; 
            addLog(`🚑 使用救援擔架！${p.name} 從陣亡區復活，並恢復 ${p.currHp} HP！(註：戰敗次數不會減少)`);
        }
        else if(card.id === 'boss_orders') {
            const enemyTeam = state.teams[teamNum]; retreatToBench(enemyTeam, targetIdx);
            addLog(`🗣️ 使用老大的指令！強制將對手後備區的 ${enemyTeam.pokemon[targetIdx].name} 拖入戰鬥區。`);
        }
        else if(card.id === 'muscle_band') {
            const p = myTeam.pokemon[targetIdx]; p.buff.dmg = 20; p.buff.turns = 2; addLog(`💪 使用力量頭帶！${p.name} 裝備後，接下來 2 回合攻擊力 +20！`);
        }
        else if(card.id === 'focus_sash') {
            const p = myTeam.pokemon[targetIdx]; p.buff.hasFocusSash = true; addLog(`🎗️ 使用氣勢披帶！${p.name} 裝備了披帶，滿血時若受致命傷可保留 10 HP！`);
        }
        else if(card.id === 'energy_search') {
            if (myTeam.hand.length < 7) myTeam.hand.push({ cardType: 'energy', type: getSmartEnergyType(myTeam) });
            if (myTeam.hand.length < 7) myTeam.hand.push({ cardType: 'energy', type: getSmartEnergyType(myTeam) });
            addLog(`🔍 使用能量搜索！隨機抽取了能量卡。`);
        }
        else if(card.id === 'prof_research') {
            addLog(`🔬 使用博士的研究！捨棄手牌，重新抽了 3 張卡。`);
            myTeam.hand.splice(state.selectedHandItem.index, 1);
            myTeam.hand = []; 
            for(let i=0; i<3; i++){
                if(Math.random() < 0.6 && myTeam.hand.length < 7) { myTeam.hand.push({ cardType: 'energy', type: getSmartEnergyType(myTeam) }); } 
                else if (myTeam.hand.length < 7) { const trainer = TRAINERS_DB[Math.floor(Math.random() * TRAINERS_DB.length)]; myTeam.hand.push({ cardType: 'trainer', ...trainer }); }
            }
            consumed = false; 
        }

        if (consumed) { myTeam.hand.splice(state.selectedHandItem.index, 1); }
        state.selectedHandItem = null; updateHint("訓練家卡使用完畢。"); render();
    }

    function canUseAttack(pokemon, attack) {
        let eCopy = [...pokemon.attachedEnergy];
        let rainbowCount = eCopy.filter(e => e === 'rainbow').length;
        eCopy = eCopy.filter(e => e !== 'rainbow');
        for(let costType of attack.cost) {
            if(costType !== 'any') {
                let idx = eCopy.indexOf(costType);
                if(idx !== -1) { eCopy.splice(idx, 1); } 
                else if (rainbowCount > 0) { rainbowCount--; } 
                else { return false; }
            }
        }
        let anyCount = attack.cost.filter(c => c === 'any').length;
        return (eCopy.length + rainbowCount) >= anyCount;
    }

    function executeAttack(event, teamNum, atkIdx) {
        if (event) event.stopPropagation(); 
        if (state.isAttacking) return; 
        
        try {
            if (teamNum !== state.currentTeam) { return showAlert("這不是您的隊伍，無法使用其招式！"); }
            if (state.step !== 'action') { return showAlert("請先答對題目，或目前無法攻擊！"); }
            
            const myTeam = state.teams[state.currentTeam]; 
            const attacker = myTeam.pokemon[myTeam.activeIdx];
            
            if (attacker.status.asleep) { return showAlert("💤 您的寶可夢正在睡眠中，本回合無法攻擊！"); }
            if (attacker.status.paralyze) { return showAlert("⚡ 您的寶可夢處於麻痺狀態，本回合無法攻擊！"); }
            if (attacker.status.cant_attack > 0) { return showAlert("🚫 該寶可夢受副作用影響，本回合無法攻擊！請選擇使用道具或撤退。"); }
            
            const atk = attacker.attacks[atkIdx];
            if (!atk) { return showAlert("招式讀取錯誤！"); }

            if (!canUseAttack(attacker, atk)) {
                return showAlert("能量不足！請確認是否具備指定的屬性能量。");
            }

            state.isAttacking = true;
            state.pendingAttack = { attacker, atk, enemyTeamNum: state.currentTeam === 1 ? 2 : 1 };

            if (attacker.status.confused) {
                state.coinFlipReason = 'confusion';
                document.getElementById('coin-desc').innerHTML = `<b>${attacker.name}</b> 處於💫混亂狀態！<br>請擲硬幣，若為反面將會攻擊失敗並自傷 30 點！`;
                const coinInner = document.getElementById('coin-inner');
                if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
                document.getElementById('coin-modal').style.display = 'flex'; 
                return;
            }

            continueAttack();

        } catch (e) {
            state.isAttacking = false; 
            showAlert("系統錯誤: " + e.message);
            addLog("❌ 攻擊發生系統錯誤: " + e.message);
            console.error(e);
        }
    }

    function continueAttack() {
        const atk = state.pendingAttack.atk;
        if(atk.special && typeof atk.special === 'string' && atk.special.includes('flip') && !atk.special.startsWith('flip_')) {
            state.coinFlipReason = 'attack'; let desc = '發動招式附加效果：<br>';
            if(atk.special === 'paralyze_flip') desc += '若為正面，對手將陷入麻痺狀態！';
            else if(atk.special === 'poison_flip') desc += '若為正面，對手將陷入中毒狀態！';
            else if(atk.special === 'burn_flip') desc += '若為正面，對手將陷入灼傷狀態！';
            else if(atk.special === 'confuse_flip') desc += '若為正面，對手將陷入混亂！';
            else if(atk.special === 'damage_flip') desc += '若為正面，將造成額外 20 點傷害！';
            else if(atk.special === 'damage_flip_20') desc += '若為正面，將造成額外 20 點傷害！';
            else if(atk.special === 'damage_flip_30') desc += '若為正面，將造成額外 30 點傷害！';
            else if(atk.special === 'immune_next_flip') desc += '若為正面，下回合免受傷害！';
            else if(atk.special === 'reduce_dmg_taken_flip') desc += '若為正面，下回合受傷-30！';
            else if(atk.special === 'dmg_flip') desc += '必須為正面才能造成傷害！';
            else if(atk.special === 'discard_enemy_energy_flip') desc += '若為正面，丟棄對手 1 個能量！';
            else if(atk.special === 'asleep_flip') desc += '若為正面，對手將陷入睡眠！';
            else if(atk.special === 'confuse_self_flip') desc += '若為反面，自己將陷入混亂！';
            
            document.getElementById('coin-desc').innerHTML = desc;
            const coinInner = document.getElementById('coin-inner');
            if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
            document.getElementById('coin-modal').style.display = 'flex';
        } else if (atk.special === 'flip_3_x20' || atk.special === 'flip_3_x30') {
            state.coinFlipsQueue = 3; state.coinFlipsResults = 0; promptMultiFlip();
        } else if (atk.special === 'flip_2_x20' || atk.special === 'flip_2_x30') {
            state.coinFlipsQueue = 2; state.coinFlipsResults = 0; promptMultiFlip();
        } else { resolveAttack(null); }
    }

    function promptMultiFlip() {
        if (state.coinFlipsQueue > 0) {
            state.coinFlipReason = 'multi_attack';
            document.getElementById('coin-desc').innerHTML = `連續擲硬幣攻擊！<br>還有 <b>${state.coinFlipsQueue}</b> 次擲硬幣機會，請擲幣：`;
            const coinInner = document.getElementById('coin-inner');
            if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
            document.getElementById('coin-modal').style.display = 'flex';
        } else { resolveAttack(state.coinFlipsResults); }
    }

    function autoFlipCoin() {
        const coinBtn = document.getElementById('auto-coin');
        if (coinBtn && coinBtn.classList.contains('flipping')) return;
        if(coinBtn) coinBtn.classList.add('flipping');
        const coinInner = document.getElementById('coin-inner');
        const isHeads = Math.random() < 0.5;
        const spins = 5; const deg = spins * 360 + (isHeads ? 0 : 180);
        if(coinInner) {
            coinInner.style.transition = 'transform 2s cubic-bezier(0.2, 0.8, 0.3, 1)';
            coinInner.style.transform = `rotateY(${deg}deg)`;
        }
        setTimeout(() => { 
            if(coinBtn) coinBtn.classList.remove('flipping'); 
            resolveCoinFlip(isHeads); 
            setTimeout(() => {
                if(coinInner) {
                    coinInner.style.transition = 'none';
                    coinInner.style.transform = `rotateY(0deg)`;
                }
            }, 500);
        }, 2100);
    }

    function resolveCoinFlip(isHeads) {
        document.getElementById('coin-modal').style.display = 'none'; const reason = state.coinFlipReason;
        if (reason === 'confusion') {
            if (isHeads) { addLog(`💫 擲出正面！${state.pendingAttack.attacker.name} 克服混亂，準備發動攻擊。`); continueAttack(); } 
            else {
                addLog(`💫 擲出反面！攻擊失敗，${state.pendingAttack.attacker.name} 因混亂而受到 30 點傷害。`);
                const attacker = state.pendingAttack.attacker; attacker.currHp = Math.max(0, attacker.currHp - 30);
                
                showDamage(attacker.uid, 30, 'normal', false, attacker.uid);

                if (attacker.currHp <= 0 && !attacker.isDead) {
                     attacker.isDead = true; state.teams[state.currentTeam].lostLives++; addLog(`💀 ${attacker.name} 氣絕了！`);
                     if(checkGameOver()) return;
                }
                state.step = 'finished'; state.selectedHandItem = null; state.isAttacking = false; render(); setTimeout(processEndOfTurn, 1500);
            }
        } else if (reason === 'catcher') {
            const myTeam = state.teams[state.currentTeam]; const enemyTeamNum = state.currentTeam === 1 ? 2 : 1; const enemyTeam = state.teams[enemyTeamNum];
            if (isHeads) { addLog(`🪤 擲出正面！強制對手換上 ${enemyTeam.pokemon[state.pendingCatcherTarget].name}。`); retreatToBench(enemyTeam, state.pendingCatcherTarget); } 
            else { addLog(`🪤 擲出反面！捕捉器失效。`); }
            
            if (state.selectedHandItem) { myTeam.hand.splice(state.selectedHandItem.index, 1); }
            state.selectedHandItem = null; updateHint("訓練家卡使用完畢。"); render();
            
        } else if (reason === 'attack') { resolveAttack(isHeads);
        } else if (reason === 'multi_attack') {
            if(isHeads) state.coinFlipsResults++; state.coinFlipsQueue--; promptMultiFlip();
        } else if (reason === 'burn' || reason === 'asleep') {
            const flip = state.eotFlips.shift(); const p = state.teams[flip.team].pokemon[flip.pIdx];
            if (isHeads) {
                if (reason === 'burn') { p.status.burn = false; addLog(`🔥 擲出正面！${p.name} 解除灼傷。`); }
                if (reason === 'asleep') { p.status.asleep = false; addLog(`💤 擲出正面！${p.name} 醒來了。`); }
            } else {
                if (reason === 'burn') addLog(`🔥 擲出反面！${p.name} 持續灼傷。`);
                if (reason === 'asleep') addLog(`💤 擲出反面！${p.name} 繼續熟睡。`);
            }
            render(); setTimeout(processNextEotFlip, 800);
        }
    }

    // ★ 修正：將扣血與 showDamage 完美整合，去除無效的 triggerHitFX ★
    function resolveAttack(coinResult) {
        try {
            const { attacker, atk, enemyTeamNum } = state.pendingAttack;
            const defender = state.teams[enemyTeamNum].pokemon[state.teams[enemyTeamNum].activeIdx];

            const atkIdx = attacker.attacks.indexOf(atk);
            const isUltimate = (attacker.hp >= 100 && atkIdx === 1);

            let dmg = atk.d; let logText = `⚔️ ${attacker.name} 使用了「${atk.n}」！`;

            if (atk.special === 'force_swap_choose') {
                const aliveBench = state.teams[enemyTeamNum].pokemon.filter((p, i) => i !== state.teams[enemyTeamNum].activeIdx && p.currHp > 0);
                if(aliveBench.length > 0) {
                    logText += ` (發動誘導香氣，請選擇對手後備寶可夢)`; addLog(logText);
                    state.step = 'select_enemy_bench'; state.pendingAttack = null; state.isAttacking = false; updateHint("請選擇一隻對手後備區的寶可夢將其拖上戰鬥場！"); render(); return;
                } else { logText += ` (對手無後備寶可夢，招式無效)`; }
            }
            
            if (atk.special === 'transform_choose') {
                logText += ` (發動變身，將複製對手招式與附著能量！請選擇對手場上任一寶可夢)`;
                addLog(logText);
                state.step = 'select_transform_target'; state.transformingPokemon = attacker; state.pendingAttack = null; state.isAttacking = false; updateHint("請選擇一隻對手場上的寶可夢進行複製！"); render(); return;
            }
            
            if (atk.special === 'confuse_self_flip') {
                if(coinResult === false) { attacker.status.confused = true; logText += ` [硬幣反面] 自己陷入混亂！`; } 
                else { logText += ` [硬幣正面] 安全！沒有陷入混亂。`; }
            }

            if(atk.special === 'damage_flip' && coinResult === true) dmg += 20; 
            if(atk.special === 'damage_flip_20' && coinResult === true) dmg += 20;
            if(atk.special === 'damage_flip_30' && coinResult === true) dmg += 30;
            if(atk.special === 'dmg_flip') { if(coinResult === false) { logText += ' [硬幣: 反面] 攻擊失敗，沒有造成傷害。'; dmg = 0; } }
            if(atk.special === 'flip_3_x20') { dmg = coinResult * 20; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_3_x30') { dmg = coinResult * 30; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_2_x20') { dmg = coinResult * 20; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_2_x30') { dmg = coinResult * 30; logText += ` [擲出 ${coinResult} 次正面]`; }
            
            if(atk.special === 'plus_dmg_per_elec') { let extraElec = attacker.attachedEnergy.filter(e => e === 'electric' || e === 'rainbow').length - 2; if(extraElec > 0) dmg += Math.min(2, extraElec) * 10; }
            if(atk.special === 'plus_dmg_per_water') { let extraWater = attacker.attachedEnergy.filter(e => e === 'water' || e === 'rainbow').length - 2; if(extraWater > 0) dmg += Math.min(2, extraWater) * 10; }

            if(defender.status.immune_next) { dmg = 0; logText += ` (對手免疫了這次傷害！)`; } 
            else {
                if(defender.status.reduce_dmg_20) dmg = Math.max(0, dmg - 20);
                if(defender.status.reduce_dmg_30) dmg = Math.max(0, dmg - 30);
                if(defender.status.reduce_dmg_50) dmg = Math.max(0, dmg - 50);
            }
            if(attacker.status.enemy_dmg_minus_30 > 0) { dmg = Math.max(0, dmg - 30); logText += ` (受到牽制，傷害-30)`; }

            if(dmg > 0) {
                if(attacker.buff.turns > 0) dmg += attacker.buff.dmg;
                let isWeakness = false, isResisted = false;
                if(defender.weakness === attacker.type) { dmg = Math.floor(dmg * 1.5); isWeakness = true; }
                
                if (atk.special !== 'ignore_resistance') {
                    if(defender.resistance.type === attacker.type || defender.resistance.type === 'any') { dmg -= defender.resistance.val; isResisted = true; }
                }
                
                dmg = Math.max(0, dmg); 
                if (defender.buff.hasFocusSash && defender.currHp === defender.hp && dmg >= defender.hp) {
                    dmg = defender.hp - 10; defender.buff.hasFocusSash = false; logText += ` 🎗️ 觸發氣勢披帶！保留了 10 HP！`;
                }
                defender.currHp = Math.max(0, defender.currHp - dmg);
                
                // ★ 調用修復後的 showDamage ★
                showDamage(defender.uid, dmg, attacker.type, isUltimate, attacker.uid);
                
                logText += `造成 ${dmg} 點傷害！`;
                if (isWeakness) logText += ' (弱點加成 x1.5！)';
                if (isResisted) logText += ' (抗性減免！)';
                if (attacker.buff.turns > 0) logText += ' (裝備加成！)';
                if (atk.special === 'ignore_resistance') logText += ' (無視抗性與減傷！)';
            } else if (atk.d > 0) { 
                showDamage(defender.uid, 0, attacker.type, false, attacker.uid);
            }

            if (atk.special === 'poison') { defender.status.poison = true; logText += ` ☠️ ${defender.name} 中毒了！`; }
            if (atk.special === 'poison_flip' && coinResult === true) { defender.status.poison = true; logText += ` ☠️ ${defender.name} 中毒了！`; }
            if (atk.special === 'burn') { defender.status.burn = true; logText += ` 🔥 ${defender.name} 灼傷了！`; }
            if (atk.special === 'burn_flip' && coinResult === true) { defender.status.burn = true; logText += ` 🔥 ${defender.name} 灼傷了！`; }
            if (atk.special === 'asleep') { defender.status.asleep = true; logText += ` 💤 ${defender.name} 陷入睡眠！`; }
            if (atk.special === 'asleep_flip' && coinResult === true) { defender.status.asleep = true; logText += ` 💤 ${defender.name} 陷入睡眠！`; }
            if (atk.special === 'asleep_self') { attacker.status.asleep = true; logText += ` 💤 (副作用：自己陷入睡眠)`; }
            if (atk.special === 'confuse') { defender.status.confused = true; logText += ` 💫 ${defender.name} 陷入混亂！`; }
            if (atk.special === 'confuse_flip' && coinResult === true) { defender.status.confused = true; logText += ` 💫 ${defender.name} 陷入混亂！`; }
            if (atk.special === 'paralyze_flip' && coinResult === true) { defender.status.paralyze = true; logText += ` ⚡ ${defender.name} 被麻痺了！`; }
            if (atk.special === 'heal_self_20') { attacker.currHp = Math.min(attacker.hp, attacker.currHp + 20); logText += ` (恢復20HP)`; }
            if (atk.special === 'heal_self_30') { attacker.currHp = Math.min(attacker.hp, attacker.currHp + 30); logText += ` (恢復30HP)`; }
            if (atk.special === 'heal_all_30') { state.teams[state.currentTeam].pokemon.forEach(p => { if(p.currHp > 0) p.currHp = Math.min(p.hp, p.currHp + 30); }); logText += ` (己方全體恢復30HP)`; }
            if (atk.special === 'cant_act_next') { attacker.status.cant_attack = 2; logText += ` (該寶可夢下回合無法使用招式)`; }
            if (atk.special === 'discard_1_fire') { 
                let removed = 0; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'fire' || e === 'rainbow') && removed < 1) { removed++; return false; } return true; });
                logText += ` (喪失1個火能量)`;
            }
            if (atk.special === 'discard_2_fire') { 
                let removed = 0; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'fire' || e === 'rainbow') && removed < 2) { removed++; return false; } return true; });
                logText += ` (喪失2個火能量)`;
            }
            if (atk.special === 'immune_next_flip' && coinResult === true) { attacker.status.immune_next = true; logText += ` [硬幣: 正面] 下回合免傷！`; }
            if (atk.special === 'reduce_dmg_taken_flip' && coinResult === true) { attacker.status.reduce_dmg_30 = true; logText += ` [硬幣: 正面] 下回合受傷-30！`; }
            if (atk.special === 'reduce_dmg_taken_20') { attacker.status.reduce_dmg_20 = true; }
            if (atk.special === 'reduce_dmg_taken_30') { attacker.status.reduce_dmg_30 = true; }
            if (atk.special === 'reduce_dmg_taken_50') { attacker.status.reduce_dmg_50 = true; }
            if (atk.special === 'self_dmg_20') { attacker.currHp = Math.max(0, attacker.currHp - 20); showDamage(attacker.uid, 20, 'normal', false, attacker.uid); logText += ` (自傷20點)`; }
            if (atk.special === 'self_dmg_30') { attacker.currHp = Math.max(0, attacker.currHp - 30); showDamage(attacker.uid, 30, 'normal', false, attacker.uid); logText += ` (自傷30點)`; }
            
            if (atk.special === 'draw_1') { 
                if (state.teams[state.currentTeam].hand.length < 7) { state.teams[state.currentTeam].hand.push({ cardType: 'energy', type: 'normal' }); }
                logText += ` (抽了1張卡)`; 
            }
            if (atk.special === 'draw_2') { 
                if (state.teams[state.currentTeam].hand.length < 7) state.teams[state.currentTeam].hand.push({ cardType: 'energy', type: 'normal' });
                if (state.teams[state.currentTeam].hand.length < 7) state.teams[state.currentTeam].hand.push({ cardType: 'energy', type: 'normal' });
                logText += ` (抽了2張卡)`; 
            }
            if (atk.special === 'discard_enemy_energy') { if(defender.attachedEnergy.length > 0) { defender.attachedEnergy.pop(); logText += ` (丟棄對手1個能量)`; } }
            if (atk.special === 'discard_enemy_energy_flip' && coinResult === true) { if(defender.attachedEnergy.length > 0) { defender.attachedEnergy.pop(); logText += ` [硬幣: 正面] (丟棄對手1個能量)`; } }
            if (atk.special === 'discard_1_elec_and_paralyze') { let removed = false; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'electric' || e === 'rainbow') && !removed) { removed = true; return false; } return true; }); defender.status.paralyze = true; logText += ` (棄1電能，對手必定麻痺)`; }
            if (atk.special === 'enemy_dmg_minus_30') { defender.status.enemy_dmg_minus_30 = 2; logText += ` (下回合對手攻擊力-30)`; }
            
            if (atk.special === 'calm_mind_20') { attacker.buff.dmg = 20; attacker.buff.turns = 2; attacker.status.reduce_dmg_20 = true; logText += ` (專注冥想，下回攻擊傷害+20且受傷-20！)`; }
            if (atk.special === 'seal_attack') { defender.status.cant_attack = 1; if(attacker.attachedEnergy.length > 0) attacker.attachedEnergy.pop(); logText += ` (自己喪失1能量，對手下回合無法攻擊)`; }

            if (defender.currHp <= 0 && !defender.isDead) { defender.isDead = true; state.teams[enemyTeamNum].lostLives++; logText += ` 💀 敵方 ${defender.name} 氣絕了！`; }
            if (attacker.currHp <= 0 && !attacker.isDead) { attacker.isDead = true; state.teams[state.currentTeam].lostLives++; logText += ` 💀 我方 ${attacker.name} 氣絕了！`; }

            addLog(logText); 
            state.step = 'finished'; 
            state.selectedHandItem = null; 
            render(); 
            
            document.getElementById('end-turn-btn').style.display = 'block';

            if (checkGameOver()) return;
            
            setTimeout(() => {
                state.isAttacking = false;
