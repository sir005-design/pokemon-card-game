        } catch (e) {
            state.isAttacking = false;
            showAlert("攻擊結算發生錯誤: " + e.message);
            addLog("❌ 攻擊結算發生錯誤: " + e.message);
            console.error(e);
        }
    }

    function endTurn() { if(state.step === 'action' && !state.isAttacking) processEndOfTurn(); }

    function processEndOfTurn() {
        let someoneDied = false; state.eotFlips = [];
        [1, 2].forEach(t => {
            const activeP = state.teams[t].pokemon[state.teams[t].activeIdx];
            if (activeP && activeP.currHp > 0) {
                if (activeP.status.poison) { activeP.currHp = Math.max(0, activeP.currHp - 10); showDamage(activeP.uid, 10, 'poison'); addLog(`☠️ 回合結算：${activeP.name} 因中毒受到 10 點傷害。`); }
                if (activeP.status.burn) { activeP.currHp = Math.max(0, activeP.currHp - 20); showDamage(activeP.uid, 20, 'fire'); addLog(`🔥 回合結算：${activeP.name} 因灼傷受到 20 點傷害。`); state.eotFlips.push({team: t, pIdx: state.teams[t].activeIdx, type: 'burn'}); }
                if (activeP.status.asleep) { state.eotFlips.push({team: t, pIdx: state.teams[t].activeIdx, type: 'asleep'}); }
                if (activeP.currHp <= 0 && !activeP.isDead) { activeP.isDead = true; state.teams[t].lostLives++; someoneDied = true; addLog(`💀 ${activeP.name} 氣絕了！`); }
            }
            if(activeP && activeP.buff.turns > 0 && t === state.currentTeam) { activeP.buff.turns--; if(activeP.buff.turns === 0) activeP.buff.dmg = 0; }
            if(activeP && activeP.status.cant_attack > 0 && t === state.currentTeam) { activeP.status.cant_attack--; }
            if(activeP && activeP.status.enemy_dmg_minus_30 > 0 && t === state.currentTeam) { activeP.status.enemy_dmg_minus_30--; }
        });

        const endingTeamActive = state.teams[state.currentTeam].pokemon[state.teams[state.currentTeam].activeIdx];
        if (endingTeamActive && endingTeamActive.status.paralyze) { endingTeamActive.status.paralyze = false; addLog(`⚡ ${endingTeamActive.name} 的麻痺狀態解除了。`); }
        
        if (someoneDied && checkGameOver()) return;
        
        setTimeout(processNextEotFlip, 1000);
    }

    function processNextEotFlip() {
        if (state.eotFlips.length > 0) {
            const flip = state.eotFlips[0]; const p = state.teams[flip.team].pokemon[flip.pIdx];
            if (p.currHp <= 0) { state.eotFlips.shift(); processNextEotFlip(); return; }
            state.coinFlipReason = flip.type;
            document.getElementById('coin-desc').innerHTML = flip.type === 'burn' ? `請為 <b>${p.name}</b> 的🔥灼傷恢復擲硬幣：<br>正面則恢復，反面則持續。` : `請為 <b>${p.name}</b> 的💤睡眠恢復擲硬幣：<br>正面則醒來，反面則繼續睡。`;
            const coinInner = document.getElementById('coin-inner'); if(coinInner) { coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)'; }
            document.getElementById('coin-modal').style.display = 'flex';
        } else {
            state.nextTurnTeam = state.currentTeam === 1 ? 2 : 1; 
            checkEotSwaps(); 
        }
    }

    function checkEotSwaps() {
        let p1 = state.teams[1].pokemon[state.teams[1].activeIdx];
        let p2 = state.teams[2].pokemon[state.teams[2].activeIdx];

        if (p1.currHp <= 0 && state.teams[1].lostLives < 3) {
            state.currentTeam = 1;
            state.step = 'must_swap';
            updateHint("⚠️ TEAM 1 戰鬥寶可夢已氣絕！請點擊後備區替換。");
            render();
            return;
        }
        if (p2.currHp <= 0 && state.teams[2].lostLives < 3) {
            state.currentTeam = 2;
            state.step = 'must_swap';
            updateHint("⚠️ TEAM 2 戰鬥寶可夢已氣絕！請點擊後備區替換。");
            render();
            return;
        }

        state.currentTeam = state.nextTurnTeam;
        state.nextTurnTeam = null; 
        render();
        setTimeout(startQuiz, 1000);
    }

    function checkGameOver() {
        let t1Dead = state.teams[1].lostLives >= 3;
        let t2Dead = state.teams[2].lostLives >= 3;
        
        if (t1Dead && t2Dead) { showVictory(0); return true; } 
        if (t1Dead) { showVictory(2); return true; }
        if (t2Dead) { showVictory(1); return true; }
        return false;
    }

    function showVictory(winningTeamNum) {
        if (winningTeamNum === 0) {
            document.getElementById('victory-team-text').textContent = `🤝 雙方同時陣亡，平手！ 🤝`;
        } else {
            document.getElementById('victory-team-text').textContent = `🏆 TEAM ${winningTeamNum} 獲勝！ 🏆`;
        }
        
        // 渲染錯題統計
        const summaryDiv = document.getElementById('wrong-answers-summary');
        let summaryHtml = "";
        [1, 2].forEach(t => {
            const wrongs = state.teams[t].wrongAnswers;
            summaryHtml += `<h3 style="color:${t===1?'#00c3ff':'#ff6b6b'}; margin-top:${t===2?'15px':'0'}; margin-bottom:5px; font-size:18px;">Team ${t} 答錯的題目：</h3>`;
            if(wrongs.length === 0) {
                summaryHtml += `<div style="font-size:16px; color:#aaa; margin-left:10px;">(太厲害了，無答錯紀錄！)</div>`;
            } else {
                const wrongCounts = {};
                wrongs.forEach(w => { wrongCounts[w] = (wrongCounts[w] || 0) + 1; });
                
                const formattedWrongs = Object.entries(wrongCounts).map(([w, count]) => {
                    return count > 1 ? `<span style="color:#4caf50;">${w}(${count})</span>` : w;
                });
                
                summaryHtml += `<div style="font-size:16px; margin-left:10px; color:#eee; line-height: 1.6; word-wrap: break-word;">${formattedWrongs.join(' <span style="color:#888; margin:0 4px;">/</span> ')}</div>`;
            }
        });
        summaryDiv.innerHTML = summaryHtml;
        summaryDiv.style.display = 'block';

        document.getElementById('victory-modal').style.display = 'flex';
        for(let i=0; i<60; i++) {
            const conf = document.createElement('div'); conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw'; conf.style.animationDelay = Math.random() * 3 + 's';
            conf.style.backgroundColor = ['#f44336', '#2196F3', '#4CAF50', '#FFEB3B', '#E91E63'][Math.floor(Math.random()*5)];
            document.body.appendChild(conf);
        }
    }

    function inspectCard(t, pIdx) {
        const p = state.teams[t].pokemon[pIdx];
        const resText = p.resistance.type !== 'none' && p.resistance.val > 0 ? `${getTypeName(p.resistance.type)} -${p.resistance.val}` : '無';
        let statusHtml = '';
        if (p.status.poison) statusHtml += '<span class="status-tag status-poison">中毒</span>';
        if (p.status.burn) statusHtml += '<span class="status-tag status-burn">灼傷</span>';
        if (p.status.asleep) statusHtml += '<span class="status-tag status-asleep">睡眠</span>';
        if (p.status.confused) statusHtml += '<span class="status-tag status-confused">混亂</span>';
        if (p.status.paralyze) statusHtml += '<span class="status-tag status-paralyze">麻痺</span>';
        if (p.status.immune_next) statusHtml += '<span class="status-tag status-immune">免傷</span>';
        if (p.status.cant_attack > 0) statusHtml += '<span class="status-tag status-cant-act">無法攻擊</span>';
        let buffHtml = '';
        if (p.buff.turns > 0) buffHtml += `<div class="item-tag">💪攻擊+${p.buff.dmg}</div>`;
        if (p.buff.hasFocusSash) buffHtml += `<div class="item-tag">🎗️氣勢披帶</div>`;

        const cardHtml = `
            <div class="card type-${p.type}" style="cursor: default;">
                <div class="card-header">
                    <div><div style="margin-bottom:5px;">${statusHtml}</div><span style="font-size:18px;">${p.name}</span></div>
                    <div style="text-align:right;">
                        <span style="color: ${p.currHp < p.hp*0.3 ? '#ff0000' : '#000'}; font-weight:900;">HP ${p.currHp}/${p.hp}</span>
                        <div style="display:flex; gap:2px; flex-direction:column; align-items:flex-end; margin-top:2px;">${buffHtml}</div>
                    </div>
                </div>
                <div class="hp-bar" style="height:12px;"><div class="hp-fill" style="width:${(p.currHp/p.hp)*100}%; background:${(p.currHp/p.hp)*100 < 30 ? '#ff4422' : '#4caf50'}"></div></div>
                <div class="card-img"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png"></div>
                <div class="energy-container" style="padding: 5px;">已附著: ${p.attachedEnergy.length === 0 ? '無' : p.attachedEnergy.map(e => `<div class="energy-icon ${e === 'rainbow' ? 'energy-rainbow' : 'energy-' + e}"></div>`).join('')}</div>
                <div style="margin-top:15px; flex:1;">
                    ${p.attacks.map(atk => {
                        let costHtml = '';
                        if (atk.cost.length === 4) { costHtml = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:28px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; } 
                        else { costHtml = `<div style="display:flex; flex-wrap:wrap; max-width:45px; gap:2px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; }
                        return `<div class="attack-row" style="flex-direction:column; align-items:flex-start;"><div style="display:flex; width:100%; justify-content:space-between; align-items:center;"><div class="attack-cost">${costHtml}</div><span style="flex:1; margin-left:10px; font-weight:bold;">${atk.n}</span><span style="font-size:18px; font-weight:bold;">${atk.d}</span></div>${atk.desc ? `<div style="font-size:11px; color:#444; margin-top:5px;">💡 ${atk.desc}</div>` : ''}</div>`;
                    }).join('')}
                </div>
                <div style="font-size:12px; opacity:0.8; margin-top:15px; display:flex; justify-content:space-between; border-top:1px solid rgba(0,0,0,0.2); padding-top:5px;">
                    <span>弱點: ${getTypeName(p.weakness)} x1.5</span><span>抗性: ${resText}</span>
                </div>
            </div>`;
        document.getElementById('inspect-content').innerHTML = cardHtml;
        document.getElementById('inspect-modal').style.display = 'flex';
    }

    function closeInspect() { document.getElementById('inspect-modal').style.display = 'none'; }

    function render() {
        const drawSide = (t) => {
            const team = state.teams[t]; const isMyTurn = (t === state.currentTeam && state.step !== 'setup');
            document.getElementById(`side-${t}`).className = `team-container ${isMyTurn ? 'active-team' : ''}`;
            const lives = 3 - team.lostLives; let fireHtml = '';
            for(let i=0; i<3; i++) { if(i < lives) fireHtml += '<span style="text-shadow: 0 0 5px red;">🔥</span>'; else fireHtml += '<span style="opacity:0.3; filter:grayscale(100%);">🔥</span>'; }
            
            document.getElementById(`header-${t}`).innerHTML = `<h2 style="color: #ffcb05; margin:0; text-shadow: 0 0 8px rgba(255,203,5,0.6);">TEAM ${t}</h2><span style="font-size:24px;">${fireHtml}</span>`;

            let actHtml = '', benHtml = '';
            team.pokemon.forEach((p, pIdx) => {
                const isActive = (pIdx === team.activeIdx); const hpPer = (p.currHp / p.hp) * 100;
                let isValidTarget = false;
                if(isMyTurn && state.selectedHandItem) {
                    const hCard = state.selectedHandItem.data;
                    if(hCard.cardType === 'energy' && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'ally' && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'active_ally' && isActive && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'dead_ally' && p.currHp <= 0) isValidTarget = true;
                }
                if (!isMyTurn && state.step !== 'setup') {
                    if (state.selectedHandItem && state.selectedHandItem.data.target === 'enemy_bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if (state.step === 'select_enemy_bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if (state.step === 'select_transform_target' && p.currHp > 0) isValidTarget = true;
                }

                const resText = p.resistance.type !== 'none' && p.resistance.val > 0 ? `${getTypeName(p.resistance.type)} -${p.resistance.val}` : '無';
                let statusHtml = '';
                if (p.status.poison) statusHtml += '<span class="status-tag status-poison">中毒</span>';
                if (p.status.burn) statusHtml += '<span class="status-tag status-burn">灼傷</span>';
                if (p.status.asleep) statusHtml += '<span class="status-tag status-asleep">睡眠</span>';
                if (p.status.confused) statusHtml += '<span class="status-tag status-confused">混亂</span>';
                if (p.status.paralyze) statusHtml += '<span class="status-tag status-paralyze">麻痺</span>';
                if (p.status.immune_next) statusHtml += '<span class="status-tag status-immune">免傷</span>';
                if (p.status.cant_attack > 0) statusHtml += '<span class="status-tag status-cant-act">無法攻擊</span>';

                let buffHtml = '';
                if (p.buff.turns > 0) buffHtml += `<div class="item-tag">💪攻擊+${p.buff.dmg}</div>`;
                if (p.buff.hasFocusSash) buffHtml += `<div class="item-tag" style="position: absolute; top: -5px; left: 25px; z-index: 5;">🎗️</div>`;

                const deadClass = p.currHp <= 0 ? (isValidTarget ? 'dead revivable' : 'dead') : '';
                const headerClass = isActive ? 'active-header' : 'bench-header';

                let cardHtml = `
                    <div class="card type-${p.type} ${isActive ? 'card-active is-active-fighter' : 'card-bench'} ${deadClass} ${isValidTarget && p.currHp>0 ? 'valid-target' : ''}" 
                         id="${p.uid}" onclick="clickPokemon(${t}, ${pIdx})">
                        <div class="inspect-btn" onclick="event.stopPropagation(); inspectCard(${t}, ${pIdx})">🔍</div>
                        <div class="buff-container">${buffHtml}</div>
                        <div class="${headerClass}">
                            <span class="name-text">${p.name}</span>
                            <span class="hp-text" style="color: ${hpPer < 30 ? '#ff0000' : '#000'};">HP ${p.currHp}/${p.hp}</span>
                        </div>
                        <div class="status-container">${statusHtml}</div>
                        <div class="hp-bar"><div class="hp-fill" style="width:${Math.max(0, hpPer)}%; background:${hpPer < 30 ? '#ff4422' : '#4caf50'}"></div></div>
                        <div class="card-img"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png"></div>
                        <div class="energy-container">${p.attachedEnergy.map(e => `<div class="energy-icon ${e === 'rainbow' ? 'energy-rainbow' : 'energy-' + e}"></div>`).join('')}</div>
                `;

                if(isActive) {
                    cardHtml += `<div style="margin-top:5px">
                        ${p.attacks.map((atk, aIdx) => {
                            const hasEnergy = canUseAttack(p, atk);
                            const rowClass = (hasEnergy && isMyTurn && state.step === 'action') ? 'attack-ready' : 'attack-disabled';
                            let costHtml = '';
                            if (atk.cost.length === 4) { costHtml = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:28px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; } 
                            else { costHtml = `<div style="display:flex; flex-wrap:wrap; max-width:45px; gap:2px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; }
                            return `<div class="attack-row ${rowClass}" onclick="event.stopPropagation(); executeAttack(event, ${t}, ${aIdx});">
                                <div class="attack-cost">${costHtml}</div><span style="flex:1; margin-left:5px; font-weight:bold; white-space:nowrap; overflow:hidden;">${atk.n}${atk.desc ? '<span class="attack-special-icon">✨</span>' : ''}</span><span>${atk.d}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    <div style="font-size:9px; opacity:0.8; margin-top:5px; display:flex; justify-content:space-between;">
                        <span>弱點: ${getTypeName(p.weakness)} x1.5</span><span>抗性: ${resText}</span>
                    </div>`;
                } else {
                    cardHtml += `<div class="bench-attack-preview">
                        ${p.attacks.map(atk => {
                            return `<div>${atk.cost.map(c => `<div class="energy-icon energy-${c}" style="width:8px; height:8px;"></div>`).join('')}</div>`;
                        }).join('')}
                    </div>`;
                }

                cardHtml += `</div>`;
                
                if(isActive) { actHtml = `<div class="active-zone">${cardHtml}</div>`; } else { benHtml += cardHtml; }
            });
            
            if (t === 1) { document.getElementById(`field-${t}`).innerHTML = `<div class="bench-grid">${benHtml}</div>${actHtml}`; } 
            else { document.getElementById(`field-${t}`).innerHTML = `${actHtml}<div class="bench-grid">${benHtml}</div>`; }

            const handDiv = document.getElementById(`hand-${t}`); handDiv.innerHTML = '';
            team.hand.forEach((card, cIdx) => {
                const isSelected = (state.selectedHandItem && state.selectedHandItem.index === cIdx);
                const descText = card.desc ? card.desc.replace(/'/g, "\\'") : '';
                
                if(card.cardType === 'energy') {
                    handDiv.innerHTML += `<div class="hand-card hand-energy ${card.type === 'rainbow' ? 'energy-rainbow' : 'energy-' + card.type} ${isSelected ? 'selected' : ''}" 
                        onclick="selectHandCard(${cIdx})"
                        onmouseenter="showHandTooltip(${t}, '💡 提供 1 個 [${getTypeName(card.type)}] 能量')"
                        onmouseleave="hideHandTooltip(${t})">
                        <div class="energy-icon ${card.type === 'rainbow' ? 'energy-rainbow' : 'energy-' + card.type}" style="width:25px;height:25px;margin-bottom:5px;"></div><div style="color:white;text-shadow:1px 1px 2px #000;">能量</div></div>`;
                } else {
                    handDiv.innerHTML += `<div class="hand-card hand-trainer ${isSelected ? 'selected' : ''}" 
                        onclick="selectHandCard(${cIdx})"
                        onmouseenter="showHandTooltip(${t}, '💡 ${descText}')"
                        onmouseleave="hideHandTooltip(${t})">
                        <div style="font-size:24px; margin-bottom:2px;">${card.icon}</div><div>${card.name}</div></div>`;
                }
            });
        };

        drawSide(1); drawSide(2);
        
        const turnInd = document.getElementById('turn-indicator');
        const actionHint = document.getElementById('action-hint');
        const setupUI = document.getElementById('setup-ui');
        const endBtn = document.getElementById('end-turn-btn');
        
        if (state.step === 'setup') {
            turnInd.style.display = 'none';
            actionHint.style.display = 'none';
            endBtn.style.display = 'none';
            setupUI.style.display = 'flex';
            document.getElementById('btn-redraw').disabled = state.redrawsLeft <= 0;
            document.getElementById('btn-redraw').textContent = `🔄 重抽卡牌 (${state.redrawsLeft})`;
        } else {
            setupUI.style.display = 'none';
            turnInd.style.display = 'block';
            actionHint.style.display = 'block';
            turnInd.textContent = state.step === 'must_swap' ? `⚠️ TEAM ${state.currentTeam} 必須換人！` : `▶ TEAM ${state.currentTeam} 的回合`;
            turnInd.style.color = state.currentTeam === 1 ? 'var(--team1-color)' : 'var(--team2-color)';
            endBtn.style.display = state.step === 'action' ? 'block' : 'none';
        }
    }

    function getTypeName(eng) { const map = { fire: '火', water: '水', grass: '草', electric: '電', normal: '普', none: '無', poison: '毒', dragon: '龍', psychic: '超能', any: '任', rainbow: '彩虹' }; return map[eng] || eng; }
    function updateHint(txt) { document.getElementById('action-hint').innerText = txt; }
    function addLog(msg) {
        const l = document.getElementById('log'); const entry = document.createElement('div'); entry.className = 'log-entry'; entry.textContent = `[系統] ${msg}`;
        l.insertBefore(entry, l.firstChild); Array.from(l.children).forEach(child => child.style.opacity = '1');
        if (l.children.length > 8) { l.removeChild(l.lastChild); }
    }
</script>
</body>
</html>
