    function canUseAttack(pokemon, attack) {
        let eCopy = [...pokemon.attachedEnergy];
        let rainbowCount = eCopy.filter(e => e === 'rainbow').length;
        eCopy = eCopy.filter(e => e !== 'rainbow');
        for(let costType of attack.cost) {
            if(costType !== 'any') {
                let idx = eCopy.indexOf(costType);
                if(idx !== -1) { eCopy.splice(idx, 1); } 
                else if (rainbowCount > 0) { rainbowCount--; } 
                else { return false; }
            }
        }
        let anyCount = attack.cost.filter(c => c === 'any').length;
        return (eCopy.length + rainbowCount) >= anyCount;
    }

    function executeAttack(event, teamNum, atkIdx) {
        if (event) event.stopPropagation(); 
        
        if (state.isAttacking) return; 
        
        try {
            if (teamNum !== state.currentTeam) { return showAlert("這不是您的隊伍，無法使用其招式！"); }
            if (state.step !== 'action') { return showAlert("請先答對題目，或目前無法攻擊！"); }
            
            const myTeam = state.teams[state.currentTeam]; 
            const attacker = myTeam.pokemon[myTeam.activeIdx];
            
            if (attacker.status.asleep) { return showAlert("💤 您的寶可夢正在睡眠中，本回合無法攻擊！"); }
            if (attacker.status.paralyze) { return showAlert("⚡ 您的寶可夢處於麻痺狀態，本回合無法攻擊！"); }
            if (attacker.status.cant_attack > 0) { return showAlert("🚫 該寶可夢受副作用影響，本回合無法攻擊！請選擇使用道具或撤退。"); }
            
            const atk = attacker.attacks[atkIdx];
            if (!atk) { return showAlert("招式讀取錯誤！"); }

            if (!canUseAttack(attacker, atk)) {
                return showAlert("能量不足！請確認是否具備指定的屬性能量。");
            }

            state.isAttacking = true;
            state.pendingAttack = { attacker, atk, enemyTeamNum: state.currentTeam === 1 ? 2 : 1 };

            if (attacker.status.confused) {
                state.coinFlipReason = 'confusion';
                document.getElementById('coin-desc').innerHTML = `<b>${attacker.name}</b> 處於💫混亂狀態！<br>請擲硬幣，若為反面將會攻擊失敗並自傷 30 點！`;
                const coinInner = document.getElementById('coin-inner');
                coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)';
                document.getElementById('coin-modal').style.display = 'flex'; 
                return;
            }

            continueAttack();

        } catch (e) {
            state.isAttacking = false; 
            showAlert("系統錯誤: " + e.message);
            addLog("❌ 攻擊發生系統錯誤: " + e.message);
            console.error(e);
        }
    }

    function continueAttack() {
        const atk = state.pendingAttack.atk;
        if(atk.special && typeof atk.special === 'string' && atk.special.includes('flip') && !atk.special.startsWith('flip_')) {
            state.coinFlipReason = 'attack'; let desc = '發動招式附加效果：<br>';
            if(atk.special === 'paralyze_flip') desc += '若為正面，對手將陷入麻痺狀態！';
            else if(atk.special === 'poison_flip') desc += '若為正面，對手將陷入中毒狀態！';
            else if(atk.special === 'burn_flip') desc += '若為正面，對手將陷入灼傷狀態！';
            else if(atk.special === 'confuse_flip') desc += '若為正面，對手將陷入混亂！';
            else if(atk.special === 'damage_flip') desc += '若為正面，將造成額外 20 點傷害！';
            else if(atk.special === 'damage_flip_20') desc += '若為正面，將造成額外 20 點傷害！';
            else if(atk.special === 'damage_flip_30') desc += '若為正面，將造成額外 30 點傷害！';
            else if(atk.special === 'immune_next_flip') desc += '若為正面，下回合免受傷害！';
            else if(atk.special === 'reduce_dmg_taken_flip') desc += '若為正面，下回合受傷-30！';
            else if(atk.special === 'dmg_flip') desc += '必須為正面才能造成傷害！';
            else if(atk.special === 'discard_enemy_energy_flip') desc += '若為正面，丟棄對手 1 個能量！';
            else if(atk.special === 'asleep_flip') desc += '若為正面，對手將陷入睡眠！';
            else if(atk.special === 'confuse_self_flip') desc += '若為反面，自己將陷入混亂！';
            
            document.getElementById('coin-desc').innerHTML = desc;
            const coinInner = document.getElementById('coin-inner');
            coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)';
            document.getElementById('coin-modal').style.display = 'flex';
        } else if (atk.special === 'flip_3_x20' || atk.special === 'flip_3_x30') {
            state.coinFlipsQueue = 3; state.coinFlipsResults = 0; promptMultiFlip();
        } else if (atk.special === 'flip_2_x20' || atk.special === 'flip_2_x30') {
            state.coinFlipsQueue = 2; state.coinFlipsResults = 0; promptMultiFlip();
        } else { resolveAttack(null); }
    }

    function promptMultiFlip() {
        if (state.coinFlipsQueue > 0) {
            state.coinFlipReason = 'multi_attack';
            document.getElementById('coin-desc').innerHTML = `連續擲硬幣攻擊！<br>還有 <b>${state.coinFlipsQueue}</b> 次擲硬幣機會，請擲幣：`;
            const coinInner = document.getElementById('coin-inner');
            coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)';
            document.getElementById('coin-modal').style.display = 'flex';
        } else { resolveAttack(state.coinFlipsResults); }
    }

    function resolveCoinFlip(isHeads) {
        document.getElementById('coin-modal').style.display = 'none'; const reason = state.coinFlipReason;
        if (reason === 'confusion') {
            if (isHeads) { addLog(`💫 擲出正面！${state.pendingAttack.attacker.name} 克服混亂，準備發動攻擊。`); continueAttack(); } 
            else {
                addLog(`💫 擲出反面！攻擊失敗，${state.pendingAttack.attacker.name} 因混亂而受到 30 點傷害。`);
                const attacker = state.pendingAttack.attacker; attacker.currHp = Math.max(0, attacker.currHp - 30);
                showDamage(attacker.uid, 30, attacker.type, false, null);
                if (attacker.currHp <= 0 && !attacker.isDead) {
                     attacker.isDead = true; state.teams[state.currentTeam].lostLives++; addLog(`💀 ${attacker.name} 氣絕了！`);
                     if(checkGameOver()) return;
                }
                state.step = 'finished'; state.selectedHandItem = null; state.isAttacking = false; render(); setTimeout(processEndOfTurn, 1500);
            }
        } else if (reason === 'catcher') {
            const myTeam = state.teams[state.currentTeam]; const enemyTeamNum = state.currentTeam === 1 ? 2 : 1; const enemyTeam = state.teams[enemyTeamNum];
            if (isHeads) { addLog(`🪤 擲出正面！強制對手換上 ${enemyTeam.pokemon[state.pendingCatcherTarget].name}。`); retreatToBench(enemyTeam, state.pendingCatcherTarget); } 
            else { addLog(`🪤 擲出反面！捕捉器失效。`); }
            
            if (state.selectedHandItem) { myTeam.hand.splice(state.selectedHandItem.index, 1); }
            state.selectedHandItem = null; updateHint("訓練家卡使用完畢。"); render();
            
        } else if (reason === 'attack') { resolveAttack(isHeads);
        } else if (reason === 'multi_attack') {
            if(isHeads) state.coinFlipsResults++; state.coinFlipsQueue--; promptMultiFlip();
        } else if (reason === 'burn' || reason === 'asleep') {
            const flip = state.eotFlips.shift(); const p = state.teams[flip.team].pokemon[flip.pIdx];
            if (isHeads) {
                if (reason === 'burn') { p.status.burn = false; addLog(`🔥 擲出正面！${p.name} 解除灼傷。`); }
                if (reason === 'asleep') { p.status.asleep = false; addLog(`💤 擲出正面！${p.name} 醒來了。`); }
            } else {
                if (reason === 'burn') addLog(`🔥 擲出反面！${p.name} 持續灼傷。`);
                if (reason === 'asleep') addLog(`💤 擲出反面！${p.name} 繼續熟睡。`);
            }
            render(); setTimeout(processNextEotFlip, 800);
        }
    }

    function resolveAttack(coinResult) {
        try {
            const { attacker, atk, enemyTeamNum } = state.pendingAttack;
            const defender = state.teams[enemyTeamNum].pokemon[state.teams[enemyTeamNum].activeIdx];

            const atkIdx = attacker.attacks.indexOf(atk);
            const isUltimate = (attacker.hp >= 100 && atkIdx === 1);

            let dmg = atk.d; let logText = `⚔️ ${attacker.name} 使用了「${atk.n}」！`;

            if (atk.special === 'force_swap_choose') {
                const aliveBench = state.teams[enemyTeamNum].pokemon.filter((p, i) => i !== state.teams[enemyTeamNum].activeIdx && p.currHp > 0);
                if(aliveBench.length > 0) {
                    logText += ` (發動誘導香氣，請選擇對手後備寶可夢)`; addLog(logText);
                    state.step = 'select_enemy_bench'; state.pendingAttack = null; state.isAttacking = false; updateHint("請選擇一隻對手後備區的寶可夢將其拖上戰鬥場！"); render(); return;
                } else { logText += ` (對手無後備寶可夢，招式無效)`; }
            }
            
            if (atk.special === 'transform_choose') {
                logText += ` (發動變身，將複製對手招式與附著能量！請選擇對手場上任一寶可夢)`;
                addLog(logText);
                state.step = 'select_transform_target'; state.transformingPokemon = attacker; state.pendingAttack = null; state.isAttacking = false; updateHint("請選擇一隻對手場上的寶可夢進行複製！"); render(); return;
            }
            
            if (atk.special === 'confuse_self_flip') {
                if(coinResult === false) { attacker.status.confused = true; logText += ` [硬幣反面] 自己陷入混亂！`; } 
                else { logText += ` [硬幣正面] 安全！沒有陷入混亂。`; }
            }

            if(atk.special === 'damage_flip' && coinResult === true) dmg += 20; 
            if(atk.special === 'damage_flip_20' && coinResult === true) dmg += 20;
            if(atk.special === 'damage_flip_30' && coinResult === true) dmg += 30;
            if(atk.special === 'dmg_flip') { if(coinResult === false) { logText += ' [硬幣: 反面] 攻擊失敗，沒有造成傷害。'; dmg = 0; } }
            if(atk.special === 'flip_3_x20') { dmg = coinResult * 20; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_3_x30') { dmg = coinResult * 30; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_2_x20') { dmg = coinResult * 20; logText += ` [擲出 ${coinResult} 次正面]`; }
            if(atk.special === 'flip_2_x30') { dmg = coinResult * 30; logText += ` [擲出 ${coinResult} 次正面]`; }
            
            if(atk.special === 'plus_dmg_per_elec') { let extraElec = attacker.attachedEnergy.filter(e => e === 'electric' || e === 'rainbow').length - 2; if(extraElec > 0) dmg += Math.min(2, extraElec) * 10; }
            if(atk.special === 'plus_dmg_per_water') { let extraWater = attacker.attachedEnergy.filter(e => e === 'water' || e === 'rainbow').length - 2; if(extraWater > 0) dmg += Math.min(2, extraWater) * 10; }

            if(defender.status.immune_next) { dmg = 0; logText += ` (對手免疫了這次傷害！)`; } 
            else {
                if(defender.status.reduce_dmg_20) dmg = Math.max(0, dmg - 20);
                if(defender.status.reduce_dmg_30) dmg = Math.max(0, dmg - 30);
                if(defender.status.reduce_dmg_50) dmg = Math.max(0, dmg - 50);
            }
            if(attacker.status.enemy_dmg_minus_30 > 0) { dmg = Math.max(0, dmg - 30); logText += ` (受到牽制，傷害-30)`; }

            // 布莉姆溫冥想的加成
            if(dmg > 0) {
                if(attacker.buff.turns > 0) dmg += attacker.buff.dmg;
                let isWeakness = false, isResisted = false;
                if(defender.weakness === attacker.type) { dmg = Math.floor(dmg * 1.5); isWeakness = true; }
                
                if (atk.special !== 'ignore_resistance') {
                    if(defender.resistance.type === attacker.type || defender.resistance.type === 'any') { dmg -= defender.resistance.val; isResisted = true; }
                }
                
                dmg = Math.max(0, dmg); 
                if (defender.buff.hasFocusSash && defender.currHp === defender.hp && dmg >= defender.hp) {
                    dmg = defender.hp - 10; defender.buff.hasFocusSash = false; logText += ` 🎗️ 觸發氣勢披帶！保留了 10 HP！`;
                }
                defender.currHp = Math.max(0, defender.currHp - dmg);
                showDamage(defender.uid, dmg, attacker.type, isUltimate, attacker.uid);
                logText += `造成 ${dmg} 點傷害！`;
                if (isWeakness) logText += ' (弱點加成 x1.5！)';
                if (isResisted) logText += ' (抗性減免！)';
                if (attacker.buff.turns > 0) logText += ' (裝備加成！)';
                if (atk.special === 'ignore_resistance') logText += ' (無視抗性與減傷！)';
            } else if (atk.d > 0) { showDamage(defender.uid, 0, attacker.type, false, attacker.uid); }

            if (atk.special === 'poison') { defender.status.poison = true; logText += ` ☠️ ${defender.name} 中毒了！`; }
            if (atk.special === 'poison_flip' && coinResult === true) { defender.status.poison = true; logText += ` ☠️ ${defender.name} 中毒了！`; }
            if (atk.special === 'burn') { defender.status.burn = true; logText += ` 🔥 ${defender.name} 灼傷了！`; }
            if (atk.special === 'burn_flip' && coinResult === true) { defender.status.burn = true; logText += ` 🔥 ${defender.name} 灼傷了！`; }
            if (atk.special === 'asleep') { defender.status.asleep = true; logText += ` 💤 ${defender.name} 陷入睡眠！`; }
            if (atk.special === 'asleep_flip' && coinResult === true) { defender.status.asleep = true; logText += ` 💤 ${defender.name} 陷入睡眠！`; }
            if (atk.special === 'asleep_self') { attacker.status.asleep = true; logText += ` 💤 (副作用：自己陷入睡眠)`; }
            if (atk.special === 'confuse') { defender.status.confused = true; logText += ` 💫 ${defender.name} 陷入混亂！`; }
            if (atk.special === 'confuse_flip' && coinResult === true) { defender.status.confused = true; logText += ` 💫 ${defender.name} 陷入混亂！`; }
            if (atk.special === 'paralyze_flip' && coinResult === true) { defender.status.paralyze = true; logText += ` ⚡ ${defender.name} 被麻痺了！`; }
            if (atk.special === 'heal_self_20') { attacker.currHp = Math.min(attacker.hp, attacker.currHp + 20); logText += ` (恢復20HP)`; }
            if (atk.special === 'heal_self_30') { attacker.currHp = Math.min(attacker.hp, attacker.currHp + 30); logText += ` (恢復30HP)`; }
            if (atk.special === 'heal_all_30') { state.teams[state.currentTeam].pokemon.forEach(p => { if(p.currHp > 0) p.currHp = Math.min(p.hp, p.currHp + 30); }); logText += ` (己方全體恢復30HP)`; }
            if (atk.special === 'cant_act_next') { attacker.status.cant_attack = 2; logText += ` (該寶可夢下回合無法使用招式)`; }
            if (atk.special === 'discard_1_fire') { 
                let removed = 0; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'fire' || e === 'rainbow') && removed < 1) { removed++; return false; } return true; });
                logText += ` (喪失1個火能量)`;
            }
            if (atk.special === 'discard_2_fire') { 
                let removed = 0; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'fire' || e === 'rainbow') && removed < 2) { removed++; return false; } return true; });
                logText += ` (喪失2個火能量)`;
            }
            if (atk.special === 'immune_next_flip' && coinResult === true) { attacker.status.immune_next = true; logText += ` [硬幣: 正面] 下回合免傷！`; }
            if (atk.special === 'reduce_dmg_taken_flip' && coinResult === true) { attacker.status.reduce_dmg_30 = true; logText += ` [硬幣: 正面] 下回合受傷-30！`; }
            if (atk.special === 'reduce_dmg_taken_20') { attacker.status.reduce_dmg_20 = true; }
            if (atk.special === 'reduce_dmg_taken_30') { attacker.status.reduce_dmg_30 = true; }
            if (atk.special === 'reduce_dmg_taken_50') { attacker.status.reduce_dmg_50 = true; }
            if (atk.special === 'self_dmg_20') { attacker.currHp = Math.max(0, attacker.currHp - 20); showDamage(attacker.uid, 20, attacker.type, false, null); logText += ` (自傷20點)`; }
            if (atk.special === 'self_dmg_30') { attacker.currHp = Math.max(0, attacker.currHp - 30); showDamage(attacker.uid, 30, attacker.type, false, null); logText += ` (自傷30點)`; }
            if (atk.special === 'draw_1') { drawCard(state.teams[state.currentTeam], { cardType: 'energy', type: 'normal' }); logText += ` (抽了1張卡)`; }
            if (atk.special === 'draw_2') { drawCard(state.teams[state.currentTeam], { cardType: 'energy', type: 'normal' }); drawCard(state.teams[state.currentTeam], { cardType: 'energy', type: 'normal' }); logText += ` (抽了2張卡)`; }
            if (atk.special === 'discard_enemy_energy') { if(defender.attachedEnergy.length > 0) { defender.attachedEnergy.pop(); logText += ` (丟棄對手1個能量)`; } }
            if (atk.special === 'discard_enemy_energy_flip' && coinResult === true) { if(defender.attachedEnergy.length > 0) { defender.attachedEnergy.pop(); logText += ` [硬幣: 正面] (丟棄對手1個能量)`; } }
            if (atk.special === 'discard_1_elec_and_paralyze') { let removed = false; attacker.attachedEnergy = attacker.attachedEnergy.filter(e => { if((e === 'electric' || e === 'rainbow') && !removed) { removed = true; return false; } return true; }); defender.status.paralyze = true; logText += ` (棄1電能，對手必定麻痺)`; }
            if (atk.special === 'enemy_dmg_minus_30') { defender.status.enemy_dmg_minus_30 = 2; logText += ` (下回合對手攻擊力-30)`; }
            
            // ★ 修正：布莉姆溫的冥想加成
            if (atk.special === 'calm_mind_20') { attacker.buff.dmg = 20; attacker.buff.turns = 2; attacker.status.reduce_dmg_20 = true; logText += ` (專注冥想，下回攻擊傷害+20且受傷-20！)`; }
            
            // ★ 修正：沙奈朵的封印
            if (atk.special === 'seal_attack') { defender.status.cant_attack = 1; if(attacker.attachedEnergy.length > 0) attacker.attachedEnergy.pop(); logText += ` (自己喪失1能量，對手下回合無法攻擊)`; }

            if (defender.currHp <= 0 && !defender.isDead) { defender.isDead = true; state.teams[enemyTeamNum].lostLives++; logText += ` 💀 敵方 ${defender.name} 氣絕了！`; }
            if (attacker.currHp <= 0 && !attacker.isDead) { attacker.isDead = true; state.teams[state.currentTeam].lostLives++; logText += ` 💀 我方 ${attacker.name} 氣絕了！`; }

            addLog(logText); 
            state.step = 'finished'; 
            state.selectedHandItem = null; 
            state.isAttacking = false; 
            render(); 
            
            document.getElementById('end-turn-btn').style.display = 'block';

            if (checkGameOver()) return;
            
            setTimeout(processEndOfTurn, isUltimate ? 2500 : 1500);
            
        } catch (e) {
            state.isAttacking = false;
            showAlert("攻擊結算發生錯誤: " + e.message);
            addLog("❌ 攻擊結算發生錯誤: " + e.message);
            console.error(e);
        }
    }

    function endTurn() { if(state.step === 'action' && !state.isAttacking) processEndOfTurn(); }

    function processEndOfTurn() {
        let someoneDied = false; state.eotFlips = [];
        [1, 2].forEach(t => {
            const activeP = state.teams[t].pokemon[state.teams[t].activeIdx];
            if (activeP && activeP.currHp > 0) {
                if (activeP.status.poison) { activeP.currHp = Math.max(0, activeP.currHp - 10); showDamage(activeP.uid, 10, 'poison', false, null); addLog(`☠️ 回合結算：${activeP.name} 因中毒受到 10 點傷害。`); }
                if (activeP.status.burn) { activeP.currHp = Math.max(0, activeP.currHp - 20); showDamage(activeP.uid, 20, 'fire', false, null); addLog(`🔥 回合結算：${activeP.name} 因灼傷受到 20 點傷害。`); state.eotFlips.push({team: t, pIdx: state.teams[t].activeIdx, type: 'burn'}); }
                if (activeP.status.asleep) { state.eotFlips.push({team: t, pIdx: state.teams[t].activeIdx, type: 'asleep'}); }
                if (activeP.currHp <= 0 && !activeP.isDead) { activeP.isDead = true; state.teams[t].lostLives++; someoneDied = true; addLog(`💀 ${activeP.name} 氣絕了！`); }
            }
            if(activeP && activeP.buff.turns > 0 && t === state.currentTeam) { activeP.buff.turns--; if(activeP.buff.turns === 0) activeP.buff.dmg = 0; }
            if(activeP && activeP.status.cant_attack > 0 && t === state.currentTeam) { activeP.status.cant_attack--; }
            if(activeP && activeP.status.enemy_dmg_minus_30 > 0 && t === state.currentTeam) { activeP.status.enemy_dmg_minus_30--; }
        });

        const endingTeamActive = state.teams[state.currentTeam].pokemon[state.teams[state.currentTeam].activeIdx];
        if (endingTeamActive && endingTeamActive.status.paralyze) { endingTeamActive.status.paralyze = false; addLog(`⚡ ${endingTeamActive.name} 的麻痺狀態解除了。`); }
        
        if (someoneDied && checkGameOver()) return;
        
        setTimeout(processNextEotFlip, 1000);
    }

    function processNextEotFlip() {
        if (state.eotFlips.length > 0) {
            const flip = state.eotFlips[0]; const p = state.teams[flip.team].pokemon[flip.pIdx];
            if (p.currHp <= 0) { state.eotFlips.shift(); processNextEotFlip(); return; }
            state.coinFlipReason = flip.type;
            document.getElementById('coin-desc').innerHTML = flip.type === 'burn' ? `請為 <b>${p.name}</b> 的🔥灼傷恢復擲硬幣：<br>正面則恢復，反面則持續。` : `請為 <b>${p.name}</b> 的💤睡眠恢復擲硬幣：<br>正面則醒來，反面則繼續睡。`;
            const coinInner = document.getElementById('coin-inner'); coinInner.style.transition = 'none'; coinInner.style.transform = 'rotateY(0deg)';
            document.getElementById('coin-modal').style.display = 'flex';
        } else {
            state.nextTurnTeam = state.currentTeam === 1 ? 2 : 1; 
            checkEotSwaps(); 
        }
    }

    function checkEotSwaps() {
        let p1 = state.teams[1].pokemon[state.teams[1].activeIdx];
        let p2 = state.teams[2].pokemon[state.teams[2].activeIdx];

        if (p1.currHp <= 0 && state.teams[1].lostLives < 3) {
            state.currentTeam = 1;
            state.step = 'must_swap';
            updateHint("⚠️ TEAM 1 戰鬥寶可夢已氣絕！請點擊後備區替換。");
            render();
            return;
        }
        if (p2.currHp <= 0 && state.teams[2].lostLives < 3) {
            state.currentTeam = 2;
            state.step = 'must_swap';
            updateHint("⚠️ TEAM 2 戰鬥寶可夢已氣絕！請點擊後備區替換。");
            render();
            return;
        }

        state.currentTeam = state.nextTurnTeam;
        state.nextTurnTeam = null; 
        render();
        setTimeout(startQuiz, 1000);
    }

    function checkGameOver() {
        let t1Dead = state.teams[1].lostLives >= 3;
        let t2Dead = state.teams[2].lostLives >= 3;
        
        if (t1Dead && t2Dead) { showVictory(0); return true; } 
        if (t1Dead) { showVictory(2); return true; }
        if (t2Dead) { showVictory(1); return true; }
        return false;
    }

    function showVictory(winningTeamNum) {
        if (winningTeamNum === 0) {
            document.getElementById('victory-team-text').textContent = `🤝 雙方同時陣亡，平手！ 🤝`;
        } else {
            document.getElementById('victory-team-text').textContent = `🏆 TEAM ${winningTeamNum} 獲勝！ 🏆`;
        }
        document.getElementById('victory-modal').style.display = 'flex';
        for(let i=0; i<60; i++) {
            const conf = document.createElement('div'); conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw'; conf.style.animationDelay = Math.random() * 3 + 's';
            conf.style.backgroundColor = ['#f44336', '#2196F3', '#4CAF50', '#FFEB3B', '#E91E63'][Math.floor(Math.random()*5)];
            document.body.appendChild(conf);
        }
    }

    function inspectCard(t, pIdx) {
        const p = state.teams[t].pokemon[pIdx];
        const resText = p.resistance.type !== 'none' && p.resistance.val > 0 ? `${getTypeName(p.resistance.type)} -${p.resistance.val}` : '無';
        let statusHtml = '';
        if (p.status.poison) statusHtml += '<span class="status-tag status-poison">中毒</span>';
        if (p.status.burn) statusHtml += '<span class="status-tag status-burn">灼傷</span>';
        if (p.status.asleep) statusHtml += '<span class="status-tag status-asleep">睡眠</span>';
        if (p.status.confused) statusHtml += '<span class="status-tag status-confused">混亂</span>';
        if (p.status.paralyze) statusHtml += '<span class="status-tag status-paralyze">麻痺</span>';
        if (p.status.immune_next) statusHtml += '<span class="status-tag status-immune">免傷</span>';
        if (p.status.cant_attack > 0) statusHtml += '<span class="status-tag status-cant-act">無法攻擊</span>';
        let buffHtml = '';
        if (p.buff.turns > 0) buffHtml += `<div class="item-tag">💪攻擊+${p.buff.dmg}</div>`;
        if (p.buff.hasFocusSash) buffHtml += `<div class="item-tag">🎗️氣勢披帶</div>`;

        const cardHtml = `
            <div class="card type-${p.type}" style="cursor: default;">
                <div class="card-header">
                    <div><div style="margin-bottom:5px;">${statusHtml}</div><span style="font-size:18px;">${p.name}</span></div>
                    <div style="text-align:right;">
                        <span style="color: ${p.currHp < p.hp*0.3 ? '#ff0000' : '#000'}; font-weight:900;">HP ${p.currHp}/${p.hp}</span>
                        <div style="display:flex; gap:2px; flex-direction:column; align-items:flex-end; margin-top:2px;">${buffHtml}</div>
                    </div>
                </div>
                <div class="hp-bar" style="height:12px;"><div class="hp-fill" style="width:${(p.currHp/p.hp)*100}%; background:${(p.currHp/p.hp)*100 < 30 ? '#ff4422' : '#4caf50'}"></div></div>
                <div class="card-img"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png"></div>
                <div class="energy-container" style="padding: 5px;">已附著: ${p.attachedEnergy.length === 0 ? '無' : p.attachedEnergy.map(e => `<div class="energy-icon energy-${e}"></div>`).join('')}</div>
                <div style="margin-top:15px; flex:1;">
                    ${p.attacks.map(atk => {
                        let costHtml = '';
                        if (atk.cost.length === 4) { costHtml = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:28px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; } 
                        else { costHtml = `<div style="display:flex; flex-wrap:wrap; max-width:45px; gap:2px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; }
                        return `<div class="attack-row" style="flex-direction:column; align-items:flex-start;"><div style="display:flex; width:100%; justify-content:space-between; align-items:center;"><div class="attack-cost">${costHtml}</div><span style="flex:1; margin-left:10px; font-weight:bold;">${atk.n}</span><span style="font-size:18px; font-weight:bold;">${atk.d}</span></div>${atk.desc ? `<div style="font-size:11px; color:#444; margin-top:5px;">💡 ${atk.desc}</div>` : ''}</div>`;
                    }).join('')}
                </div>
                <div style="font-size:12px; opacity:0.8; margin-top:15px; display:flex; justify-content:space-between; border-top:1px solid rgba(0,0,0,0.2); padding-top:5px;">
                    <span>弱點: ${getTypeName(p.weakness)} x1.5</span><span>抗性: ${resText}</span>
                </div>
            </div>`;
        document.getElementById('inspect-content').innerHTML = cardHtml;
        document.getElementById('inspect-modal').style.display = 'flex';
    }

    function closeInspect() { document.getElementById('inspect-modal').style.display = 'none'; }

    function render() {
        const drawSide = (t) => {
            const team = state.teams[t]; const isMyTurn = (t === state.currentTeam && state.step !== 'setup');
            document.getElementById(`side-${t}`).className = `team-container ${isMyTurn ? 'active-team' : ''}`;
            const lives = 3 - team.lostLives; let fireHtml = '';
            for(let i=0; i<3; i++) { if(i < lives) fireHtml += '<span style="text-shadow: 0 0 5px red;">🔥</span>'; else fireHtml += '<span style="opacity:0.3; filter:grayscale(100%);">🔥</span>'; }
            
            document.getElementById(`header-${t}`).innerHTML = `<h2 style="color: #ffcb05; margin:0; text-shadow: 0 0 8px rgba(255,203,5,0.6);">TEAM ${t}</h2><span style="font-size:24px;">${fireHtml}</span>`;

            let actHtml = '', benHtml = '';
            team.pokemon.forEach((p, pIdx) => {
                const isActive = (pIdx === team.activeIdx); const hpPer = (p.currHp / p.hp) * 100;
                let isValidTarget = false;
                if(isMyTurn && state.selectedHandItem) {
                    const hCard = state.selectedHandItem.data;
                    if(hCard.cardType === 'energy' && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'ally' && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'active_ally' && isActive && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if(hCard.target === 'dead_ally' && p.currHp <= 0) isValidTarget = true;
                }
                if (!isMyTurn && state.step !== 'setup') {
                    if (state.selectedHandItem && state.selectedHandItem.data.target === 'enemy_bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if (state.step === 'select_enemy_bench' && !isActive && p.currHp > 0) isValidTarget = true;
                    if (state.step === 'select_transform_target' && p.currHp > 0) isValidTarget = true;
                }

                const resText = p.resistance.type !== 'none' && p.resistance.val > 0 ? `${getTypeName(p.resistance.type)} -${p.resistance.val}` : '無';
                let statusHtml = '';
                if (p.status.poison) statusHtml += '<span class="status-tag status-poison">中毒</span>';
                if (p.status.burn) statusHtml += '<span class="status-tag status-burn">灼傷</span>';
                if (p.status.asleep) statusHtml += '<span class="status-tag status-asleep">睡眠</span>';
                if (p.status.confused) statusHtml += '<span class="status-tag status-confused">混亂</span>';
                if (p.status.paralyze) statusHtml += '<span class="status-tag status-paralyze">麻痺</span>';
                if (p.status.immune_next) statusHtml += '<span class="status-tag status-immune">免傷</span>';
                if (p.status.cant_attack > 0) statusHtml += '<span class="status-tag status-cant-act">無法攻擊</span>';

                let buffHtml = '';
                if (p.buff.turns > 0) buffHtml += `<div class="item-tag">💪攻擊+${p.buff.dmg}</div>`;
                if (p.buff.hasFocusSash) buffHtml += `<div class="item-tag">🎗️氣勢披帶</div>`;

                const deadClass = p.currHp <= 0 ? (isValidTarget ? 'dead revivable' : 'dead') : '';

                let cardHtml = `
                    <div class="card type-${p.type} ${isActive ? 'card-active is-active-fighter' : 'card-bench'} ${deadClass} ${isValidTarget && p.currHp>0 ? 'valid-target' : ''}" 
                         id="${p.uid}" onclick="clickPokemon(${t}, ${pIdx})">
                        <div class="inspect-btn" onclick="event.stopPropagation(); inspectCard(${t}, ${pIdx})">🔍</div>
                        <div class="buff-container">${buffHtml}</div>
                        <div class="card-header" style="margin-left:20px;">
                            <span>${p.name}</span>
                            <span style="color: ${hpPer < 30 ? '#ff0000' : '#000'}; font-size:10px; font-weight:900;">HP ${p.currHp}/${p.hp}</span>
                        </div>
                        <div class="status-container">${statusHtml}</div>
                        <div class="hp-bar"><div class="hp-fill" style="width:${Math.max(0, hpPer)}%; background:${hpPer < 30 ? '#ff4422' : '#4caf50'}"></div></div>
                        <div class="card-img"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png"></div>
                        <div class="energy-container">${p.attachedEnergy.map(e => `<div class="energy-icon energy-${e}"></div>`).join('')}</div>
                `;

                if(isActive) {
                    cardHtml += `<div style="margin-top:5px">
                        ${p.attacks.map((atk, aIdx) => {
                            const hasEnergy = canUseAttack(p, atk);
                            const rowClass = hasEnergy ? 'attack-ready' : 'attack-disabled';
                            let costHtml = '';
                            if (atk.cost.length === 4) { costHtml = `<div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:28px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; } 
                            else { costHtml = `<div style="display:flex; flex-wrap:wrap; max-width:45px; gap:2px;">${atk.cost.map(c => `<div class="energy-icon energy-${c}"></div>`).join('')}</div>`; }
                            return `<div class="attack-row ${rowClass}" onclick="executeAttack(event, ${t}, ${aIdx});">
                                <div class="attack-cost">${costHtml}</div><span style="flex:1; margin-left:5px; font-weight:bold; white-space:nowrap; overflow:hidden;">${atk.n}${atk.desc ? '<span class="attack-special-icon">✨</span>' : ''}</span><span>${atk.d}</span>
                            </div>`;
                        }).join('')}
                    </div>
                    <div style="font-size:9px; opacity:0.8; margin-top:5px; display:flex; justify-content:space-between;">
                        <span>弱點: ${getTypeName(p.weakness)} x1.5</span><span>抗性: ${resText}</span>
                    </div>`;
                } else {
                    cardHtml += `<div class="bench-attack-preview">
                        ${p.attacks.map(atk => {
                            return `<div>${atk.cost.map(c => `<div class="energy-icon energy-${c}" style="width:8px; height:8px;"></div>`).join('')}</div>`;
                        }).join('')}
                    </div>`;
                }

                cardHtml += `</div>`;
                
                if(isActive) { actHtml = `<div class="active-zone">${cardHtml}</div>`; } else { benHtml += cardHtml; }
            });
            
            if (t === 1) { document.getElementById(`field-${t}`).innerHTML = `<div class="bench-grid">${benHtml}</div>${actHtml}`; } 
            else { document.getElementById(`field-${t}`).innerHTML = `${actHtml}<div class="bench-grid">${benHtml}</div>`; }

            const handDiv = document.getElementById(`hand-${t}`); handDiv.innerHTML = '';
            team.hand.forEach((card, cIdx) => {
                const isSelected = (state.selectedHandItem && state.selectedHandItem.index === cIdx);
                const descText = card.desc ? card.desc.replace(/'/g, "\\'") : '';
                
                if(card.cardType === 'energy') {
                    handDiv.innerHTML += `<div class="hand-card hand-energy energy-${card.type} ${isSelected ? 'selected' : ''}" 
                        onclick="selectHandCard(${cIdx})"
                        onmouseenter="showHandTooltip(${t}, '💡 提供 1 個 [${getTypeName(card.type)}] 能量')"
                        onmouseleave="hideHandTooltip(${t})">
                        <div class="energy-icon energy-${card.type}" style="width:25px;height:25px;margin-bottom:5px;"></div><div style="color:white;text-shadow:1px 1px 2px #000;">能量</div></div>`;
                } else {
                    handDiv.innerHTML += `<div class="hand-card hand-trainer ${isSelected ? 'selected' : ''}" 
                        onclick="selectHandCard(${cIdx})"
                        onmouseenter="showHandTooltip(${t}, '💡 ${descText}')"
                        onmouseleave="hideHandTooltip(${t})">
                        <div style="font-size:24px; margin-bottom:2px;">${card.icon}</div><div>${card.name}</div></div>`;
                }
            });
        };

        drawSide(1); drawSide(2);
        
        const turnInd = document.getElementById('turn-indicator');
        const actionHint = document.getElementById('action-hint');
        const setupUI = document.getElementById('setup-ui');
        const endBtn = document.getElementById('end-turn-btn');
        
        if (state.step === 'setup') {
            turnInd.style.display = 'none';
            actionHint.style.display = 'none';
            endBtn.style.display = 'none';
            setupUI.style.display = 'flex';
            document.getElementById('btn-redraw').disabled = state.redrawsLeft <= 0;
            document.getElementById('btn-redraw').textContent = `🔄 重抽卡牌 (${state.redrawsLeft})`;
        } else {
            setupUI.style.display = 'none';
            turnInd.style.display = 'block';
            actionHint.style.display = 'block';
            turnInd.textContent = state.step === 'must_swap' ? `⚠️ TEAM ${state.currentTeam} 必須換人！` : `▶ TEAM ${state.currentTeam} 的回合`;
            turnInd.style.color = state.currentTeam === 1 ? 'var(--team1-color)' : 'var(--team2-color)';
            endBtn.style.display = state.step === 'action' ? 'block' : 'none';
        }
    }

    function getTypeName(eng) { const map = { fire: '火', water: '水', grass: '草', electric: '電', normal: '普', none: '無', poison: '毒', dragon: '龍', psychic: '超能' }; return map[eng] || eng; }
    function updateHint(txt) { document.getElementById('action-hint').innerText = txt; }
    function addLog(msg) {
        const l = document.getElementById('log'); const entry = document.createElement('div'); entry.className = 'log-entry'; entry.textContent = `[系統] ${msg}`;
        l.insertBefore(entry, l.firstChild); Array.from(l.children).forEach(child => child.style.opacity = '1');
        if (l.children.length > 8) { l.removeChild(l.lastChild); }
    }
</script>
</body>
</html>
